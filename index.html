<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>가계부</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16243D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="가계부">
<style>
  /* 오늘병원과 같은 색·모양 */
  :root {
    --head:      #16243D;
    --blue:      #2D5BD7;
    --blue-dk:   #1E48B4;
    --blue-tint: #E8EFFD;

    --ink:      #141C2B;
    --ink-mid:  #5A6880;
    --ink-dim:  #8B96AA;
    --paper:    #F2F5FA;
    --surface:  #FFFFFF;
    --rule:     #DFE5EF;

    --go:      #1B7A43;
    --go-bg:   #E6F3EA;
    --stop:    #B3261E;
    --stop-bg: #FBEAE8;
    --wait:    #4A5B6E;
    --wait-bg: #EBEFF3;

    --shadow: 0 1px 2px rgba(16,28,50,.05), 0 4px 14px rgba(16,28,50,.07);
    --tabh:   62px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* 홈 화면 앱에서 상태표시줄 아래·탭 아래가 비어 보이지 않게
     바탕을 위쪽은 헤더 남색, 아래쪽은 탭 흰색으로 깐다 */
  html { background: linear-gradient(to bottom, var(--head) 0, var(--head) 50%, var(--surface) 50%, var(--surface) 100%); min-height: 100%; }
  body {
    min-height: 100vh;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: var(--paper); color: var(--ink);
    font-size: 15px; line-height: 1.45;
    padding-bottom: calc(var(--tabh) + 96px);
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--blue-dk); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- 상단 ---------- */
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--head); color: #fff;
    padding: calc(10px + env(safe-area-inset-top)) 16px 14px;
    border-radius: 0 0 20px 20px;
  }
  header::before {   /* 위로 끌어내렸을 때도 남색이 이어지게 */
    content: ""; position: absolute; left: 0; right: 0; bottom: 100%; height: 400px; background: var(--head);
  }
  .hrow { display: flex; align-items: center; gap: 4px; }
  .hrow h1 { flex: 1; margin: 0; text-align: center; font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
  .hbtn {
    width: 40px; height: 40px; padding: 0; border-radius: 12px;
    background: rgba(255,255,255,.1); color: #fff; display: grid; place-items: center;
  }
  .hbtn svg { width: 20px; height: 20px; }
  .hsum { text-align: center; margin: 8px 0 12px; }
  .hsum .hl { font-size: 12.5px; opacity: .72; }
  .hsum .ht { font-size: 30px; font-weight: 800; letter-spacing: -.03em; margin-top: 1px; }
  .hsum .ht small { font-size: 17px; font-weight: 700; margin-left: 2px; }
  .rbar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .rbar button, .rbar > span {
    padding: 7px 12px; border: none; border-radius: 999px;
    font-size: 13px; font-weight: 700; letter-spacing: -0.2px;
    background: rgba(255,255,255,.16); color: #fff; white-space: nowrap;
  }
  .rbar button.on { background: #fff; color: var(--head); }
  .rbar .n { font-size: 11.5px; font-weight: 600; margin-left: 5px; opacity: .78; font-variant-numeric: tabular-nums; }
  .rbar .warn .n { color: #FFB4A9; opacity: 1; }
  .rbar .on.warn .n { color: var(--stop); }

  .wrap { padding: 16px 14px 0; }
  .empty { text-align: center; color: var(--ink-dim); padding: 46px 0; font-size: 14px; }

  /* ---------- 하단 탭 ---------- */
  #tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: flex; gap: 4px; background: var(--surface); border-top: 1px solid var(--rule);
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  }
  #tabs::after {     /* 탭 아래에 틈이 생겨도 흰색으로 메운다 */
    content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 400px; background: var(--surface);
  }
  #tabs button {
    flex: 1; height: 44px; min-width: 0; background: none; color: var(--ink-mid);
    border-radius: 22px; font-size: 13.5px; font-weight: 500; padding: 0;
  }
  #tabs button.on {
    color: var(--blue-dk); font-weight: 700; background: var(--blue-tint);
    box-shadow: inset 0 0 0 1.5px var(--blue);
  }
  .tabcnt {
    display: none; margin-left: 5px; font-size: 11px; font-weight: 700;
    background: var(--stop); color: #fff; border-radius: 9px; padding: 1px 6px; vertical-align: 1px;
  }
  .tabcnt.show { display: inline-block; }

  /* ---------- 날짜 구분 ---------- */
  .dayhead {
    display: flex; align-items: baseline; gap: 9px; margin: 22px 4px 9px;
    font-size: 15px; font-weight: 700; letter-spacing: -.02em;
  }
  .dayhead:first-child { margin-top: 2px; }
  .dayhead .cnt { font-weight: 500; color: var(--ink-mid); font-size: 12.5px; }
  .dayhead .sum { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--ink-mid); }
  .dayhead.today { color: var(--blue-dk); }

  /* ---------- 거래 카드 ---------- */
  .rec {
    display: block; width: 100%; text-align: left;
    background: var(--surface); border-left: 5px solid #D8E0EC; border-radius: 13px;
    box-shadow: var(--shadow); padding: 11px 13px 10px; margin-bottom: 8px; color: var(--ink);
    font-weight: 400;
  }
  .rec:active { opacity: .7; }
  /* 분류할 결제: 카드 안에서 바로 고른다 */
  .qbox { background: var(--surface); border-radius: 13px; box-shadow: var(--shadow); border-left: 5px solid var(--stop); padding: 11px 13px 12px; margin-bottom: 8px; }
  .qbox.done { opacity: .45; }
  .qbox .rtop h2 { font-size: 15.5px; }
  .qchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .qchips button { min-height: 38px; padding: 0 12px; border-radius: 19px; font-size: 13.5px; font-weight: 600; background: #EFF3F9; color: var(--ink); }
  .qchips button.sel { background: var(--blue); color: #fff; }
  .qchips.cards button { background: transparent; box-shadow: inset 0 0 0 1px #D2DBE9; color: var(--ink-mid); font-size: 12.5px; min-height: 34px; }
  .qchips.cards button.sel { background: var(--blue-tint); box-shadow: inset 0 0 0 1.5px var(--blue); color: var(--blue-dk); }
  .qmemo { width: 100%; margin-top: 9px; padding: 9px 11px; font-size: 16px; font-family: inherit; border: 1.5px solid var(--rule); border-radius: 10px; color: var(--ink); background: var(--surface); -webkit-appearance: none; appearance: none; }
  .qmemo:focus { border-color: var(--blue); outline: none; }
  .qlbl { font-size: 11.5px; font-weight: 700; color: var(--ink-dim); margin: 9px 0 -3px; }
  .qhead { display: flex; align-items: baseline; gap: 8px; margin: 2px 4px 9px; font-size: 15px; font-weight: 800; color: var(--stop); }
  .qhead .cnt { font-size: 12.5px; font-weight: 600; color: var(--ink-mid); }
  .qhead .more { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--ink-mid); background: none; padding: 6px 4px; }
  .rtop { display: flex; align-items: baseline; gap: 10px; }
  .rtop h2 {
    flex: 1; min-width: 0; margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .rtop .amt { font-size: 16px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .rtop .amt.minus { color: var(--go); }
  .meta { margin-top: 3px; font-size: 12.5px; color: var(--ink-mid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .sep { color: #C3CDDC; margin: 0 6px; }
  .meta b { font-weight: 700; }
  .meta b.no { color: var(--stop); }
  .meta b.yes { color: var(--go); }
  .tag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 7px; border-radius: 7px; margin-left: 6px; vertical-align: 1px; }
  .tag.no  { background: var(--stop-bg); color: var(--stop); }
  .tag.yes { background: var(--go-bg); color: var(--go); }
  .tag.wait { background: var(--wait-bg); color: var(--wait); }

  /* ---------- 통계 ---------- */
  .rhead { margin: 20px 3px 8px; font-size: 13px; font-weight: 800; color: var(--ink-mid); letter-spacing: -0.2px; }
  .rhead:first-child { margin-top: 3px; }
  .rhead .cnt { font-size: 11.5px; font-weight: 600; color: var(--ink-dim); margin-left: 5px; }
  .panel { background: var(--surface); border-radius: 13px; box-shadow: var(--shadow); padding: 4px 14px; }
  .bar { padding: 12px 0; }
  .bar + .bar { border-top: 1px solid #ECF1F7; }
  .bar .bt { display: flex; align-items: baseline; gap: 8px; margin-bottom: 7px; }
  .bar .bt .nm { flex: 1; min-width: 0; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 7px; }
  .bar .bt .nm i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .bar .bt .v { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar .bt .v small { color: var(--ink-dim); font-weight: 600; margin-left: 4px; font-size: 12.5px; }
  .track { height: 9px; border-radius: 5px; background: #EDF1F7; overflow: hidden; }
  .fill { height: 100%; border-radius: 5px; background: var(--blue); }
  .bf { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12.5px; color: var(--ink-mid); font-variant-numeric: tabular-nums; }
  .bf .done { color: var(--go); font-weight: 700; }
  .note { font-size: 12.5px; color: var(--ink-dim); margin: 9px 4px 0; line-height: 1.55; }

  /* ---------- 카드 목록 ---------- */
  .crec { background: var(--surface); border-radius: 13px; box-shadow: var(--shadow); padding: 12px 13px; margin-bottom: 8px; }
  .chead { display: flex; align-items: center; gap: 8px; }
  .chead h2 { flex: 1; min-width: 0; margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .edit {
    flex: 0 0 auto; min-height: 32px; padding: 0 14px; border-radius: 16px;
    background: transparent; box-shadow: inset 0 0 0 1px #D2DBE9; color: var(--ink-mid); font-size: 12.5px; font-weight: 600;
  }
  .ver {
    display: block; width: 100%; text-align: center; font-size: 12.5px; color: var(--ink-mid);
    padding: 14px 0 10px; background: var(--surface); border-radius: 12px; margin-top: 18px;
    box-shadow: inset 0 0 0 1px var(--rule); font-weight: 400;
  }
  .ver b { display: block; font-size: 14px; font-weight: 700; color: var(--blue-dk); }
  .ver .vsub { display: block; margin-top: 3px; font-size: 11px; color: var(--ink-dim); }

  /* ---------- 버튼 ---------- */
  button {
    font-family: inherit; font-size: 14px; font-weight: 600; border: none; border-radius: 11px;
    padding: 10px 16px; background: var(--blue); color: #fff; cursor: pointer;
  }
  button.ghost { background: #E9EFF7; color: var(--ink); }
  button:active { opacity: .68; }
  #fab {
    position: fixed; right: 18px; bottom: calc(var(--tabh) + 22px + env(safe-area-inset-bottom));
    width: 58px; height: 58px; border-radius: 29px; font-size: 30px; font-weight: 300; line-height: 1; padding: 0;
    background: var(--blue); box-shadow: 0 6px 18px rgba(45,91,215,.38); z-index: 41;
  }

  /* ---------- 시트 ---------- */
  .sheet {
    position: fixed; inset: 0; background: var(--surface); z-index: 50; overflow-y: auto; display: none;
    padding: calc(18px + env(safe-area-inset-top)) 16px 112px; animation: rise .16s ease-out;
  }
  .sheet.open { display: block; }
  @keyframes rise { from { transform: translateY(14px); opacity: .4; } }
  @media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
  .sheet h2 { margin: 2px 0 20px; font-size: 21px; font-weight: 700; letter-spacing: -.02em; }
  .sheet .lead { margin: -10px 0 20px; font-size: 13.5px; color: var(--ink-mid); line-height: 1.55; }
  label, .field { display: block; margin-bottom: 17px; }
  .lbl { display: block; font-size: 13px; font-weight: 600; color: var(--ink-mid); margin-bottom: 7px; }
  input[type=text], input[type=date], input[type=time], input[type=month] {
    width: 100%; padding: 12px 13px; font-size: 16px; border: 1.5px solid var(--rule); border-radius: 12px;
    font-family: inherit; background: var(--surface); color: var(--ink); -webkit-appearance: none; appearance: none;
  }
  input:focus { border-color: var(--blue); outline: none; }
  input[type=time], input[type=date], input[type=month] { font-variant-numeric: tabular-nums; min-height: 49px; }
  input.big { font-size: 26px; font-weight: 800; letter-spacing: -.02em; padding: 10px 13px; font-variant-numeric: tabular-nums; }
  .two { display: flex; gap: 8px; }
  .two > * { flex: 1; min-width: 0; }
  .seg { display: flex; gap: 7px; }
  .seg button {
    flex: 1; min-height: 48px; padding: 0 4px; border-radius: 12px;
    background: #EFF3F9; color: var(--ink-mid); font-size: 14px; font-weight: 500;
  }
  .seg button.sel { background: var(--blue); color: #fff; font-weight: 700; }
  .seg.many { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .seg.many button, .seg.many input { min-width: 0; width: 100%; }
  .seg.minus button.sel { background: var(--go); }
  .chkrow {
    display: flex; align-items: center; gap: 9px; min-height: 46px; padding: 0 13px; border-radius: 11px;
    background: #EFF3F9; cursor: pointer; -webkit-user-select: none; user-select: none;
  }
  .chkrow .box {
    flex: 0 0 auto; width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 6px;
    background: #fff; box-shadow: inset 0 0 0 1.5px #CCD6E6; color: transparent; font-size: 14px; font-weight: 700;
  }
  .chkrow .txt { font-size: 13.5px; color: var(--ink-mid); }
  .chkrow .txt small { display: block; font-size: 12px; color: var(--ink-dim); }
  .chkrow.on { background: var(--go-bg); }
  .chkrow.on .box { background: var(--go); box-shadow: none; color: #fff; }
  .chkrow.on .txt { color: var(--go); font-weight: 600; }
  .raw { padding: 9px 11px; background: var(--paper); border-radius: 10px; font-size: 12.5px; color: var(--ink-mid); word-break: break-all; line-height: 1.55; }
  .memo { padding: 8px 11px; background: var(--blue-tint); border-radius: 9px; font-size: 12.5px; color: #2C3E63; margin: -6px 0 17px; line-height: 1.5; }
  .actions {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--rule);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 9px; z-index: 60;
  }
  .actions button { flex: 1; min-height: 50px; font-size: 15px; font-weight: 700; border-radius: 13px; }
  .actions button.del { flex: 0 0 66px; background: var(--stop-bg); color: var(--stop); padding: 0; }
  .actions button.del.sure { flex: 0 0 96px; background: var(--stop); color: #fff; }
  .actions button:disabled { opacity: .5; }

  #toast {
    position: fixed; left: 50%; bottom: calc(var(--tabh) + 88px); transform: translateX(-50%);
    background: rgba(20,28,43,.94); color: #fff; padding: 11px 19px; border-radius: 22px;
    font-size: 13.5px; display: none; z-index: 100; max-width: 88vw; text-align: center; white-space: pre-line; line-height: 1.5;
  }
  #busy {
    position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 99;
    background: #fff; color: var(--head); border-radius: 14px; padding: 5px 12px; font-size: 12.5px; font-weight: 700;
    box-shadow: var(--shadow); display: none;
  }
  #busy.on { display: block; }
  #upd {
    display: none; position: fixed; z-index: 60; left: 10px; right: 10px; bottom: calc(var(--tabh) + 14px + env(safe-area-inset-bottom));
    background: var(--ink); color: #fff; border-radius: 13px; padding: 12px 12px 12px 16px;
    align-items: center; gap: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.28); font-size: 13.5px; font-weight: 600;
  }
  #upd.on { display: flex; }
  #upd span { flex: 1; min-width: 0; }
  #upd button { flex: 0 0 auto; min-height: 38px; padding: 0 16px; border-radius: 10px; font-size: 13.5px; font-weight: 700; }
  .ver { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .menu button { display: block; width: 100%; min-height: 54px; margin-bottom: 9px; text-align: left; padding: 0 16px; border-radius: 13px; font-size: 15px; }
  .menu button small { display: block; font-size: 12px; font-weight: 500; opacity: .75; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="hrow">
    <button class="hbtn" id="prev" aria-label="이전 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 id="monthTitle" class="num">가계부</h1>
    <button class="hbtn" id="next" aria-label="다음 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="hsum"><div class="hl" id="heroLabel">&nbsp;</div><div class="ht num" id="heroTotal">&nbsp;</div></div>
  <div class="rbar" id="chips"></div>
</header>

<div class="wrap" id="view"><div class="empty">불러오는 중…</div></div>

<button id="fab" aria-label="추가">+</button>

<div id="tabs">
  <button id="tab_list" class="on" data-tab="list">내역<span id="uncCnt" class="tabcnt"></span></button>
  <button id="tab_inc" data-tab="inc">수입</button>
  <button id="tab_stats" data-tab="stats">통계</button>
  <button id="tab_loans" data-tab="loans">고정지출</button>
  <button id="tab_cards" data-tab="cards">카드</button>
</div>

<div id="sheet" class="sheet"></div>
<div id="upd"><span id="updTxt">새 버전이 나왔습니다</span><button id="updBtn">새로고침</button></div>
<div id="toast"></div>
<div id="busy">저장 중…</div>

<script>
/* ============================================================
   가계부 — 화면 (깃허브 페이지)
   비밀키는 이 기기에만 저장합니다. (오늘병원과 같은 구조)
   ============================================================ */
var APP_VER = 'v28';
var NEED_SERVER = 26;   /* 이 앱이 필요로 하는 서버(Code.gs) 판 번호 */   /* 깃허브에 새로 올릴 때마다 숫자를 올린다. 앱이 스스로 알아채고 바꾼다 */
/* 서버 주소를 여기 적어 두면 새 기기에서는 비밀키만 넣으면 된다.
   비워 두면 처음 한 번 '시작하기' 창에서 받는다. */
var API_DEFAULT = '';
var API = API_DEFAULT, CODE = '';
try { API = localStorage.getItem('ldg_api') || API_DEFAULT; CODE = localStorage.getItem('ldg_code') || ''; } catch (e) {}

var COLORS = ['#E07A5F', '#C9A227', '#7A6FD0', '#3D8EB9', '#E3779B', '#3FA37A', '#8D8A82', '#D9822B', '#5B8C5A', '#B0619F', '#4F7CAC', '#A0785A'];
var SHORTCUT_NAME = '카드 사용 내역 및 알림 기록';
var S = { data: null, month: '', tab: 'list', filter: 'all' };
var _seq = 0, BUSY = 0;
/* 저장 줄: 누르면 화면에 바로 반영하고, 서버에는 뒤에서 한 건씩 보낸다.
   앱이 꺼져도 남은 저장은 기기에 적어 두었다가 다음에 켜질 때 이어서 보낸다. */
var WQ = [], WBUSY = false, WRETRY = 0;
try { WQ = JSON.parse(localStorage.getItem('ldg_wq') || '[]') || []; } catch (e) { WQ = []; }

/* ---------- 서버 통신 (JSONP — 오늘병원과 같은 방식) ---------- */
function jsonp_(params, ok, fail, opts) {
  var cb = '__cb' + (++_seq) + '_' + Date.now();
  var url = API + '?code=' + encodeURIComponent(CODE) + '&cb=' + cb;

  if ($('qAuto')) $('qAuto').onclick = function () {
    var list = S.data.txs.filter(function (t) { return isUnc(t) && S.shopCat[t.shop]; });

      var card = QSEL[t.id] !== undefined ? QSEL[t.id] : t.card, memo = QMEMO[t.id] !== undefined ? QMEMO[t.id].trim() : cleanMemo(t.memo);
      delete QSEL[t.id]; delete QMEMO[t.id];
      queueWrite_({ fn: 'saveTx', data: { id: t.id, amount: t.amount, type: t.type, when: t.when, category: S.shopCat[t.shop], card: card || '', memo: memo, excl: t.excl, inst: t.inst || 0 } });

      };
    });
    qa('#view .qbox[data-id="' + id + '"] [data-cat]').forEach(function (b) {

}
/* 분류 버튼: 바로 반영(목록에서 빠짐)하고 서버 저장은 뒤에서 */
function quickSave(id, cat, box) {
  var t = S.data.txs.filter(function (x) { return x.id === id; })[0];
  if (!t) return;
  var card = QSEL[id] !== undefined ? QSEL[id] : t.card;
  var memoEl = box.querySelector('.qmemo');
  var memo = memoEl ? memoEl.value.trim() : cleanMemo(t.memo);
  delete QSEL[id]; delete QMEMO[id];
  queueWrite_({ fn: 'saveTx', data: { id: t.id, amount: t.amount, type: t.type, when: t.when, category: cat, card: card || '', memo: memo, excl: t.excl, inst: t.inst || 0 } });
  toast(cat + '(으)로 분류했습니다');
}

/* 검색: 가맹점·메모·분류·카드·금액으로 모든 달에서 찾는다. 입력할 때 결과 칸만 다시 그려서 키보드가 닫히지 않게 */
function searchHit_(t, q) {
  var hay = [t.memo, t.shop, t.eCat, t.eCard, t.app, t.raw].join(' ').toLowerCase();
  var num = q.replace(/[,\s원]/g, '');
  return q.toLowerCase().split(/\s+/).every(function (w) { return !w || hay.indexOf(w) >= 0; }) || (/^\d{3,}$/.test(num) && String(t.amount).indexOf(num) >= 0);
}
function searchRes_() {
  var q = (S.q || '').trim(), box = $('qres');
  if (!box) return;
  if (!q) { box.innerHTML = ''; return; }
  var hits = S.data.txs.filter(function (t) { return searchHit_(t, q); }).sort(function (a, b) { return a.when < b.when ? 1 : -1; });
  var html = '<div class="dayhead" style="margin-top:4px">검색 결과<span class="cnt">' + hits.length + '건</span><span class="sum num">' + won(sum(hits)) + '</span></div>';
  if (!hits.length) html += '<div class="empty" style="padding:24px 0">찾는 결제가 없습니다.</div>';
  var lastM = '';
  hits.slice(0, 200).forEach(function (t) {
    var ym = t.when.slice(0, 7);
    if (ym !== lastM) { html += '<div class="meta" style="margin:12px 4px 6px;font-weight:700">' + ym.slice(0, 4) + '년 ' + Number(ym.slice(5)) + '월</div>'; lastM = ym; }
    html += recHtml(t).replace('<div class="meta">', '<div class="meta">' + Number(t.when.slice(5, 7)) + '/' + Number(t.when.slice(8, 10)) + ' ');
  });
  box.innerHTML = html;
  qa('#qres .rec').forEach(function (b) { b.onclick = function () { openTx(b.dataset.id); }; });
}
function renderList(list) {
  var sbox = '<div style="position:relative;margin:0 0 12px"><input type="search" id="qin" placeholder="검색 — 가맹점·메모·분류·카드·금액" value="' + esc(S.q || '') + '" ' +
             'style="width:100%;padding:11px 13px;font-size:16px;font-family:inherit;border:1.5px solid var(--rule);border-radius:12px;background:var(--surface);color:var(--ink);-webkit-appearance:none;appearance:none"></div>';
  if ((S.q || '').trim()) {
    $('view').innerHTML = sbox + '<div id="qres"></div>';
    bindSearch_(); searchRes_(); return;
  }
  var rows = list.slice();
  if (S.filter === 'unc') rows = rows.filter(isUnc);
  if (S.filter === 'nocard') rows = rows.filter(function (t) { return !t.eCard; });
  rows.sort(function (a, b) { return a.when < b.when ? 1 : a.when > b.when ? -1 : 0; });
  var top = (S.filter === 'all' || S.filter === 'unc') ? quickHtml() : '';
  if (S.filter === 'unc') { $('view').innerHTML = top || '<div class="empty">분류할 결제가 없습니다.</div>'; bindQuick(); return; }
  if (!rows.length) {
    $('view').innerHTML = sbox + top + '<div class="empty">' + (S.filter === 'all' ? '이 달의 거래가 없습니다.<br>+ 를 눌러 직접 추가할 수 있어요.' : '해당하는 거래가 없습니다.') + '</div>';
    bindQuick(); bindSearch_();
    return;
  }
  var days = {}, order = [];
  rows.forEach(function (t) { var d = t.when.slice(0, 10); if (!days[d]) { days[d] = []; order.push(d); } days[d].push(t); });
  var today = S.data.now.slice(0, 10);
  var html = sbox + top;
  order.forEach(function (d) {
    html += '<div class="dayhead' + (d === today ? ' today' : '') + '">' + dayLabel(d) +
            '<span class="cnt">' + days[d].length + '건</span><span class="sum num">' + won(sum(days[d])) + '</span></div>';
    days[d].forEach(function (t) { html += recHtml(t); });
  });
  $('view').innerHTML = html;
  qa('#view .rec').forEach(function (b) { b.onclick = function () { openTx(b.dataset.id); }; });
  bindQuick(); bindSearch_();
}
function bindSearch_() {
  var inp = $('qin');
  if (!inp) return;
  inp.oninput = function () {
    var had = !!(S.q || '').trim();
    S.q = inp.value;
    var has = !!S.q.trim();
    if (has !== had) { render(); var n = $('qin'); if (n) { n.focus(); var L = n.value.length; try { n.setSelectionRange(L, L); } catch (e) {} } }
    else searchRes_();
  };
}

function recHtml(t) {
  var cat = t.eCat, unc = isUnc(t), memo = cleanMemo(t.memo);
  var title = memo || t.shop || (unc ? '분류 전' : cat);
  var meta = [t.when.slice(11, 16)];
  if (!unc && t.type !== '취소') meta.push(esc(cat));   /* 분류는 언제나 카드 왼쪽에 */
  if (t.eCard) meta.push(esc(t.eCard));
  else if (S.data.cards.length) meta.push('<b class="no">카드 미지정</b>');
  else meta.push(esc(t.app));
  if (t.inst >= 2 && t.type === '승인') meta.push(t.inst + '개월 할부');
  if (t.excl) meta.push('실적 제외');
  var tag = '';
  if (unc) tag = '<span class="tag no">미분류</span>';
  if (t.type === '취소') tag = '<span class="tag yes">취소</span>';
  return '<button class="rec" data-id="' + t.id + '" style="border-left-color:' + (unc ? 'var(--stop)' : catColor(cat)) + '">' +
    '<div class="rtop"><h2>' + esc(title) + tag + '</h2><span class="amt' + (t.type === '취소' ? ' minus' : '') + '">' +
    (t.type === '취소' ? '−' : '') + won(t.amount) + '</span></div>' +
    '<div class="meta">' + meta.join('<span class="sep">|</span>') + '</div></button>';
}

function renderStats(list) {
  var mm0 = Number(S.month.slice(5));
  var incSum = monthInc_().reduce(function (a, r) { return a + r.amount; }, 0), spend = sum(list);
  /* 통장 흐름: 이달 통장에서 실제로 빠지는 돈 = 이달 결제일인 카드값 + 계좌 자동이체 고정지출 */
  var cardBill = 0, noBill = [];
  /* 카드값 = 이 달에 결제일이 있는 명세서 (그 달 통장에서 실제로 빠지는 돈). 예: 11월 → 11/22·11/23 결제(10월 사용분) */
  var payDays = [], partial = [];
  var firstTx = S.data.txs.reduce(function (a, t) { var d = t.when.slice(0, 10); return !a || d < a ? d : a; }, '');
  S.data.cards.forEach(function (c) {
    if (!billReady_(c)) { noBill.push(c.name); return; }
    var st = stmtOfMonth_(c, S.month);
    if (!st) return;
    var b = billOf_(c, st);
    cardBill += b.total;
    if (payDays.indexOf(mdLabel_(st.pay)) < 0) payDays.push(mdLabel_(st.pay));
    if (firstTx && st.start < firstTx && !b.carry) partial.push(c.name);   /* 앱을 쓰기 전 기간이 섞였는데 카드사 금액을 안 맞춘 청구 */
  });
  payDays.sort(function (a, b) { var x = a.split('/'), y = b.split('/'); return (x[0] - y[0]) || (x[1] - y[1]); });
  var fixAcct = S.data.loans.filter(function (l) { return l.via !== '카드'; }).reduce(function (a, l) { return a + (l.monthly || 0); }, 0);
  var left = incSum - cardBill - fixAcct;
  function row_(label, v, color) {
    return '<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #ECF1F7;font-size:14.5px"><span style="color:var(--ink-mid)">' + label + '</span>' +
           '<b style="font-variant-numeric:tabular-nums;' + (color ? 'color:' + color : '') + '">' + (v > 0 ? '+' : v < 0 ? '−' : '') + won(Math.abs(v)) + '</b></div>';
  }
  function total_(label, v) {
    return '<div style="display:flex;justify-content:space-between;padding:11px 0 8px;font-size:16px;font-weight:800"><span>' + label + '</span><span style="font-variant-numeric:tabular-nums;color:' + (v < 0 ? 'var(--stop)' : 'var(--ink)') + '">' + (v < 0 ? '−' : '') + won(Math.abs(v)) + '</span></div>';
  }
  var html = '<div class="rhead">' + mm0 + '월 통장 흐름<span class="cnt">실제로 빠져나가는 돈</span></div><div class="panel" style="padding:6px 14px">' +
    row_('들어온 돈 (수입 탭)', incSum, 'var(--go)') + row_('카드값 (' + (payDays.length ? payDays.join(', ') + ' 결제' : mm0 + '월 결제분') + ')', -cardBill) + row_('고정지출 (계좌 자동이체)', -fixAcct) +
    total_('통장에 남는 돈', left) + '</div>' +
    (partial.length ? '<div class="memo" style="background:var(--stop-bg);color:var(--stop);margin:8px 0 0">' + mm0 + '월에 결제된 ' + partial.map(esc).join(', ') + ' 카드값은 앱을 쓰기 전 사용분이라 일부만 잡혀 있어요. 정확히 보려면 카드사 앱의 ' + mm0 + '월 결제금액을 확인하세요.</div>' : '') +
    '<p class="note">카드값은 ' + mm0 + '월에 통장에서 빠지는 카드 결제(지난달 사용분)예요. 할부는 이번 회차만, 이월금액까지 넣어요.' + (noBill.length ? ' <b>결제일이 없는 카드(' + noBill.map(esc).join(', ') + ')는 빠져 있어요.</b>' : '') +
    ' 카드로 자동결제되는 고정지출은 카드값에 이미 들어 있어 따로 빼지 않아요.</p>' +
    '<div class="rhead">' + mm0 + '월 쓴 돈<span class="cnt">산 날 기준 · 할부는 전체 금액</span></div><div class="panel" style="padding:6px 14px">' +
    row_('카드·직접 입력 결제 (내역)', -spend) + row_('고정지출 (계좌 자동이체)', -fixAcct) + total_('지출 합계', -(spend + fixAcct)) + '</div>';
  html += monthCompare_(list);
  var ic = {};
  monthInc_().forEach(function (r) { ic[r.category || '기타'] = (ic[r.category || '기타'] || 0) + r.amount; });
  var ik = Object.keys(ic).sort(function (a, b) { return ic[b] - ic[a]; });
  if (ik.length) {
    var imax = Math.max.apply(null, ik.map(function (k) { return ic[k]; }));
    html += '<div class="rhead">수입 분류별</div><div class="panel">' + ik.map(function (k) {
      return '<div class="bar"><div class="bt"><span class="nm"><i style="background:' + incColor_(k) + '"></i>' + esc(k) + '</span><span class="v">' + won(ic[k]) + '<small>' + Math.round(ic[k] / incSum * 100) + '%</small></span></div>' +
             '<div class="track"><div class="fill" style="width:' + (ic[k] / imax * 100) + '%;background:' + incColor_(k) + '"></div></div></div>';
    }).join('') + '</div>';
  }
  var cats = {};
  list.forEach(function (t) { cats[t.eCat] = (cats[t.eCat] || 0) + t.sign * t.amount; });
  var keys = Object.keys(cats).filter(function (k) { return cats[k] !== 0; }).sort(function (a, b) { return cats[b] - cats[a]; });
  var max = Math.max.apply(null, keys.map(function (k) { return cats[k]; }).concat([1]));
  var total = sum(list) || 1;
  html += '<div class="rhead">분류별</div><div class="panel">';
  if (!keys.length) html += '<div class="empty" style="padding:22px 0">이 달의 거래가 없습니다.</div>';
  keys.forEach(function (k) {
    var v = cats[k];
    html += '<div class="bar"><div class="bt"><span class="nm"><i style="background:' + catColor(k) + '"></i>' + esc(k) + '</span>' +
            '<span class="v">' + won(v) + '<small>' + Math.round(v / total * 100) + '%</small></span></div>' +
            '<div class="track"><div class="fill" style="width:' + Math.max(0, v / max * 100) + '%;background:' + catColor(k) + '"></div></div></div>';
  });
  html += '</div>';
  $('view').innerHTML = html;
}

/* 월말 정리: 지난달과 비교 + 최근 6개월 쓴 돈 */
function monthCompare_(list) {
  var cur = S.month, prev = addYm_(cur, -1), mm = Number(cur.slice(5)), pm = Number(prev.slice(5));
  /* 이번 달은 아직 안 끝났으니 지난달도 같은 날짜까지만 비교 */
  var nowYm = S.data.now.slice(0, 7), dayCut = cur === nowYm ? Number(S.data.now.slice(8, 10)) : 31;
  var prevList = S.data.txs.filter(function (t) { return t.when.slice(0, 7) === prev && Number(t.when.slice(8, 10)) <= dayCut; });
  var first = S.data.txs.reduce(function (a, t) { var d = t.when.slice(0, 7); return !a || d < a ? d : a; }, '');
  function catSum(L) { var o = {}; L.forEach(function (t) { o[t.eCat] = (o[t.eCat] || 0) + t.sign * t.amount; }); return o; }
  function pct(a, b) { return b ? Math.round((a - b) / Math.abs(b) * 100) : null; }
  function chg(a, b) {
    var d = a - b, p = pct(a, b);
    if (!d) return '<span style="color:var(--ink-dim)">그대로</span>';
    return '<b style="color:' + (d > 0 ? 'var(--stop)' : 'var(--go)') + '">' + (d > 0 ? '▲ ' : '▼ ') + won(Math.abs(d)) + (p !== null ? ' (' + (d > 0 ? '+' : '') + p + '%)' : '') + '</b>';
  }
  var a = sum(list), b = sum(prevList);
  var html = '<div class="rhead">' + mm + '월 정리<span class="cnt">' + pm + '월' + (dayCut < 31 ? ' 1~' + dayCut + '일' : '') + '과 비교</span></div><div class="panel" style="padding:6px 14px">';
  if (cur > nowYm) {
    html += '<div class="meta" style="padding:10px 0;white-space:normal">아직 오지 않은 달이에요.</div></div>';
  } else if (!first || prev < first) {
    html += '<div class="meta" style="padding:10px 0;white-space:normal">' + pm + '월 기록이 없어 비교할 수 없어요. 다음 달부터 지난달과 비교해 보여 드릴게요.</div></div>';
  } else {
    html += '<div style="display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid #ECF1F7"><span style="font-weight:700">쓴 돈 ' + won(a) + '</span><span style="font-size:13.5px">' + chg(a, b) + '</span></div>';
    var ca = catSum(list), cb = catSum(prevList), keys = {};
    Object.keys(ca).concat(Object.keys(cb)).forEach(function (k) { if (k !== '취소') keys[k] = 1; });
    Object.keys(keys).map(function (k) { return { k: k, a: ca[k] || 0, b: cb[k] || 0 }; })
      .filter(function (x) { return x.a !== x.b; })
      .sort(function (x, y) { return Math.abs(y.a - y.b) - Math.abs(x.a - x.b); })
      .slice(0, 5).forEach(function (x) {
        html += '<div style="display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;font-size:13.5px;border-bottom:1px solid #F2F5FA"><span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;background:' + catColor(x.k) + '"></i>' + esc(x.k) +
                ' <span style="color:var(--ink-dim)">' + won(x.a) + '</span></span><span>' + chg(x.a, x.b) + '</span></div>';
      });
    var ia = monthInc_().reduce(function (s0, r) { return s0 + r.amount; }, 0);
    var ib = S.data.incomes.filter(function (r) { return r.date.slice(0, 7) === prev && Number(r.date.slice(8, 10)) <= dayCut; }).reduce(function (s0, r) { return s0 + r.amount; }, 0);
    if (ia || ib) html += '<div style="display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;font-size:13.5px"><span>수입 ' + won(ia) + '</span><span>' +
                          (ia === ib ? '<span style="color:var(--ink-dim)">그대로</span>' : '<b style="color:' + (ia > ib ? 'var(--go)' : 'var(--stop)') + '">' + (ia > ib ? '▲ ' : '▼ ') + won(Math.abs(ia - ib)) + '</b>') + '</span></div>';
    html += '</div>';
  }
  /* 최근 6개월 쓴 돈 */
  var months = [];
  for (var i = 5; i >= 0; i--) months.push(addYm_(cur, -i));
  var vals = months.map(function (m) { return sum(S.data.txs.filter(function (t) { return t.when.slice(0, 7) === m; })); });
  var vmax = Math.max.apply(null, vals.concat([1]));
  html += '<div class="panel" style="padding:12px 14px 10px;margin-top:8px"><div class="meta" style="margin:0 0 8px;font-weight:700">최근 6개월 쓴 돈</div><div style="display:flex;align-items:flex-end;gap:8px;height:96px">' +
    months.map(function (m, j) {
      var h = Math.max(vals[j] > 0 ? 4 : 0, Math.round(vals[j] / vmax * 70));
      return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%">' +
             '<span style="font-size:10.5px;color:var(--ink-mid);font-variant-numeric:tabular-nums;margin-bottom:3px">' + (vals[j] ? (vals[j] >= 10000 ? Math.round(vals[j] / 10000) + '만' : fmt(vals[j])) : '') + '</span>' +
             '<div style="width:100%;max-width:30px;height:' + h + 'px;border-radius:5px 5px 2px 2px;background:' + (m === cur ? 'var(--blue)' : '#C9D6EE') + '"></div>' +
             '<span style="font-size:11px;color:' + (m === cur ? 'var(--blue-dk)' : 'var(--ink-dim)') + ';font-weight:' + (m === cur ? 700 : 500) + ';margin-top:4px">' + Number(m.slice(5)) + '월</span></div>';
    }).join('') + '</div></div>';
  return html;
}
function renderCards() {
  var html = billHtml_();
  html += '<p class="note" style="margin-top:14px">결제 알림이 오면 <b>끝번호</b> → <b>키워드</b> 순서로 카드를 찾습니다. 같은 카드사의 카드가 여러 장이면(우리 LG·플래티넘) 끝번호를 꼭 넣어 주세요.</p>' +
          '<button class="ver" id="setBtn" style="margin-top:14px"><b>⚙ 설정</b>분류 편집 · 가계부.md 가져오기 · 새로고침 · 연결 설정<span class="vsub">가계부 ' + APP_VER + ' · 서버 ' + (S.data.serverVer ? 'S' + S.data.serverVer : '확인 전') + '</span></button>';
  $('view').innerHTML = html;
  qa('#view .edit[data-id]').forEach(function (b) { b.onclick = function () { openCard(b.dataset.id); }; });
  $('setBtn').onclick = openSettings_;

/* ---------- 분류 항목 편집 ----------

  var before = src.slice();
  openSheet('<h2>' + (inc ? '수입 분류' : '분류 항목') + '</h2>' +
    '<p class="lead">이름을 고치면 이미 그 분류로 저장된 ' + (inc ? '수입' : '결제') + '도 같이 바뀝니다. 지운 항목으로 저장된 ' + (inc ? '수입' : '결제') + '은 그대로 남아요.</p>' +
    '<div id="catRows"></div>' +

    '<div class="actions"><button class="ghost" id="catClose">닫기</button><button id="catSave">저장</button></div>');

        '<input type="text" value="' + esc(r.name) + '" maxlength="12" placeholder="새 항목" style="flex:1;min-width:0">' +
        '<button class="ghost" data-up="' + i + '" aria-label="위로" style="padding:0;width:42px;min-height:46px"' + (i ? '' : ' disabled') + '>↑</button>' +
        '<button class="ghost" data-dn="' + i + '" aria-label="아래로" style="padding:0;width:42px;min-height:46px"' + (i < rows.length - 1 ? '' : ' disabled') + '>↓</button>' +
        '<button data-rm="' + i + '" aria-label="지우기" style="padding:0;width:42px;min-height:46px;background:var(--stop-bg);color:var(--stop)">✕</button></div>';
    }).join('');
    qa('#catRows [data-up]').forEach(function (b) { b.onclick = function () { sync(); var i = +b.dataset.up; rows.splice(i - 1, 0, rows.splice(i, 1)[0]); paint(); }; });
    qa('#catRows [data-dn]').forEach(function (b) { b.onclick = function () { sync(); var i = +b.dataset.dn; rows.splice(i + 1, 0, rows.splice(i, 1)[0]); paint(); }; });
    qa('#catRows [data-rm]').forEach(function (b) { b.onclick = function () { sync(); rows.splice(+b.dataset.rm, 1); paint(); }; });
  }
  paint();
  $('catAdd').onclick = function () {
    sync();

    rows.push({ orig: '', name: '' }); paint();

  };

  $('catSave').onclick = function () {
    sync();
    var list = rows.map(function (r) { return r.name.trim(); });
    var bad = '';
    var seen = {};
    list.forEach(function (s) {
      if (bad) return;
      if (!s) bad = '빈 항목이 있습니다. 이름을 넣거나 ✕ 로 지워 주세요.';
      else if (s.indexOf('|') >= 0) bad = '항목 이름에 | 는 쓸 수 없습니다.';
      else if (!inc && ['미분류', '취소', '나중에'].indexOf(s) >= 0) bad = '"' + s + '" 은(는) 앱이 쓰는 이름이라 쓸 수 없습니다.';
      else if (seen[s]) bad = '"' + s + '" 이(가) 두 번 들어 있습니다.';
      seen[s] = 1;
    });
    if (!list.length) bad = '분류 항목이 하나는 있어야 합니다.';
    if (bad) { toast(bad, 3500); return; }
    if (list.join('\n') === before.join('\n')) { closeSheet(); return; }
    var renames = {};
    rows.forEach(function (r) { if (r.orig && r.orig !== r.name.trim()) renames[r.orig] = r.name.trim(); });

    });
  };
}

/* 저장한 뒤: 단축어의 '목록' 동작도 똑같이 바꾸라고 알려 주는 창 */
function showShortcutNotice(before, list, renames) {
  var renamedOld = {};
  Object.keys(renames).forEach(function (o) { renamedOld[o] = 1; });
  var added = list.filter(function (c) { return before.indexOf(c) < 0 && !Object.keys(renames).some(function (o) { return renames[o] === c; }); });
  var removed = before.filter(function (c) { return list.indexOf(c) < 0 && !renamedOld[c]; });
  var changes = [];
  Object.keys(renames).forEach(function (o) { changes.push('이름 바꿈: ' + esc(o) + ' → <b>' + esc(renames[o]) + '</b>'); });
  added.forEach(function (c) { changes.push('추가: <b>' + esc(c) + '</b>'); });
  removed.forEach(function (c) { changes.push('삭제: ' + esc(c)); });
  if (!changes.length) changes.push('순서만 바뀌었습니다.');
  var url = 'shortcuts://open-shortcut?name=' + encodeURIComponent(SHORTCUT_NAME);
  openSheet('<h2>단축어도 바꿔 주세요</h2>' +
    '<div class="memo" style="background:var(--stop-bg);color:var(--stop);margin:-8px 0 16px;font-size:13.5px">앱의 분류 항목만 바뀌었습니다. 결제할 때 뜨는 <b>단축어 팝업 목록은 저절로 바뀌지 않아요.</b></div>' +
    '<div class="rhead" style="margin-top:0">바뀐 내용</div><div class="raw" style="font-size:13.5px;line-height:1.8">' + changes.join('<br>') + '</div>' +
    '<div class="rhead">단축어 \'목록\'을 이 순서로</div><div class="raw" style="font-size:14px;line-height:1.9;color:var(--ink)">' +
      list.map(function (c, i) { return (i + 1) + '. ' + esc(c); }).join('<br>') + '<br>' + (list.length + 1) + '. 나중에 <span style="color:var(--ink-dim)">(맨 끝에 그대로 두기)</span></div>' +
    '<p class="note" style="margin-top:12px">단축어 앱 › <b>' + esc(SHORTCUT_NAME) + '</b> › 조건문(구분 = 승인) 아래 <b>목록</b> 동작에서 항목을 똑같이 고쳐 주세요. 글자가 하나라도 다르면 앱에서 다른 분류로 잡힙니다.</p>' +
    '<div class="actions"><button class="ghost" id="nLater">나중에</button><button id="nOpen">단축어 열기</button></div>');
  $('nLater').onclick = function () { closeSheet(); toast('분류 항목을 저장했습니다'); };
  $('nOpen').onclick = function () { closeSheet(); location.href = url; };
}

/* ---------- 대출: 매달 얼마·어느 은행·며칠에 나가는지만 ----------
   금리가 바뀌면 월 납입액만 고친다. 남은 원금 같은 건 은행 앱이 더 정확해서 적지 않는다. */
function num_(v) { var n = Number(String(v == null ? '' : v).replace(/[^\d.-]/g, '')); return isFinite(n) ? n : 0; }
/* 이번 달(또는 다음 달) 출금 날짜와 남은 날 수. 31일처럼 그 달에 없는 날은 말일로 */
function nextDebit_(day) {
  if (!day) return null;
  var now = S.data.now, y = +now.slice(0, 4), m = +now.slice(5, 7), d = +now.slice(8, 10);
  function pick(yy, mm) { var last = new Date(yy, mm, 0).getDate(); return { y: yy, m: mm, d: Math.min(day, last) }; }
  var t = pick(y, m);

  var diff = Math.round((new Date(t.y, t.m - 1, t.d) - new Date(y, m - 1, d)) / 86400000);
  return { m: t.m, d: t.d, diff: diff };
}
/* 보고 있는 달(ym)에 결제일이 있는 청구 */
function stmtOfMonth_(c, ym) {
  var y = +ym.slice(0, 4), m = +ym.slice(5);
  for (var k = -3; k <= 0; k++) {
    var mm = m + k, yy = y; while (mm < 1) { mm += 12; yy--; }
    var s = stmtFrom_(c, yy, mm);
    if (s.key === ym) return s;
  }
  return null;
}
var FIX_COLORS = { '대출': '#2D5BD7', '통신': '#3D8EB9', '관리비': '#C9A227', '육아·교육': '#E3779B', '구독': '#E07A5F', '기타': '#8D8A82' };
function fixKinds_() { return (S.data.fixKinds && S.data.fixKinds.length) ? S.data.fixKinds : ['대출', '통신', '관리비', '육아·교육', '구독', '기타']; }
function fixKindOf_(l) { var k = l.kind || '대출'; return fixKinds_().indexOf(k) >= 0 ? k : '기타'; }
function fixList_() { return S.data.loans.filter(function (l) { return !S.fixF || S.fixF === '전체' || fixKindOf_(l) === S.fixF; }); }
function sortedLoans_() {
  return S.data.loans.slice().sort(function (a, b) {
    var x = nextDebit_(a.day), z = nextDebit_(b.day);
    return (x ? x.diff : 99) - (z ? z.diff : 99);
  });
}
function renderLoans() {
  var ym = S.month, cur = ym === S.data.now.slice(0, 7), mm = Number(ym.slice(5));
  var L = (cur ? sortedLoans_() : S.data.loans.slice().sort(function (a, b) { return (a.day || 99) - (b.day || 99); }))   /* 이번 달은 다가오는 순, 다른 달은 날짜 순 */
            .filter(function (l) { return !S.fixF || S.fixF === '전체' || fixKindOf_(l) === S.fixF; });
  var today = +S.data.now.slice(8, 10);
  var html = '';
  if (L.length) {
    var acct = L.filter(function (l) { return l.via !== '카드'; }).reduce(function (a, l) { return a + l.monthly; }, 0), viaCard = L.reduce(function (a, l) { return a + l.monthly; }, 0) - acct;
    var doneN = L.filter(function (l) { return (l.done || []).indexOf(ym) >= 0; }).length;
    var nx = cur ? L.filter(function (l) { return l.day && (l.done || []).indexOf(ym) < 0; })[0] : null, nd = nx && nextDebit_(nx.day);
    html += '<div class="panel" style="padding:10px 14px;margin-bottom:6px;font-size:13.5px">' +
      '<div><b>' + mm + '월 처리 ' + doneN + ' / ' + L.length + '건</b>' + (nd ? ' · 다음 출금 ' + nd.m + '/' + nd.d + (nd.diff === 0 ? ' 오늘' : ' (' + nd.diff + '일 뒤)') : '') + '</div>' +
      '<div class="meta" style="margin-top:4px;white-space:normal">통장 자동이체 ' + won(acct) + (viaCard ? ' · 카드 자동결제 ' + won(viaCard) : '') + '</div></div>';

  if (!L.length) html += '<div class="empty" style="padding:26px 0">아래 + 로 추가하세요.<br>대출·통신비·관리비처럼 매달 나가는 돈이에요.</div>';
  L.forEach(function (l) {
    var done = (l.done || []).indexOf(ym) >= 0;
    var last = new Date(+ym.slice(0, 4), mm, 0).getDate(), dd = l.day ? Math.min(l.day, last) : 0;
    var when, n = l.day ? nextDebit_(l.day) : null;

    if (!l.day) when = done ? '<b class="yes">' + mm + '월 처리 완료</b>' : '출금일 미정';
    else if (cur && dd < today) {
      /* 이번 달 출금일이 지났으면 다음 출금일을 앞에 보여 준다. 막 지난 3일 동안만 확인하라고 빨갛게 */

        '<span style="flex:1;min-width:0"><span class="rtop"><h2>' + esc(l.name) + '</h2><span class="amt">' + won(l.monthly) + '</span></span>' +
        '<span class="meta" style="display:block;white-space:normal">' + [esc(fixKindOf_(l)), esc(l.via === '카드' ? (l.bank || '카드') + ' 자동결제' : (l.bank || '계좌 미입력')), when].join('<span class="sep">|</span>') + '</span>' +
        (l.memo ? '<span class="meta" style="display:block">' + esc(l.memo) + '</span>' : '') + '</span></div>' +
      '<button data-done="' + l.id + '" aria-label="' + mm + '월 처리 표시" style="flex:0 0 44px;height:44px;padding:0;border-radius:12px;font-size:22px;font-weight:800;' +
        (done ? 'background:var(--go);color:#fff' : 'background:#fff;color:transparent;box-shadow:inset 0 0 0 2px #C9D3E3') + '">✓</button></div>';
  });
  html += '<p class="note">출금을 확인하면 오른쪽 칸을 눌러 표시해 두세요. 다시 누르면 취소됩니다. 위 ‹ › 로 달을 넘기면 지난달 처리 여부도 볼 수 있어요. 금액이 바뀌면(금리 변동 등) 눌러서 금액만 고쳐 주세요. 카드로 자동결제되는 건 ‘나가는 곳: 카드’로 두면 통장 흐름에서 두 번 빠지지 않아요.</p>';
  $('view').innerHTML = html;
  qa('#view [data-loan]').forEach(function (b) { b.onclick = function () { openLoan(b.dataset.loan); }; });
  qa('#view [data-done]').forEach(function (b) {

/* ---------- 수입 ----------
   들어온 대로 적는다. 조사비처럼 매주 금액이 달라 예상할 수 없는 수입이 많아서 '예정·체크'는 두지 않는다.
   빨리 적게: 날짜는 오늘, 분류는 마지막에 쓴 것, 최근 기록 단추로 분류·금액을 한 번에 채운다. */
var INC_COLORS = ['#1B7A43', '#2D5BD7', '#C9A227', '#7A6FD0', '#E07A5F', '#3D8EB9', '#B0619F', '#8D8A82', '#D9822B', '#5B8C5A', '#4F7CAC', '#A0785A'];
function incColor_(c) { var i = S.data.incCats.indexOf(c); return i >= 0 ? INC_COLORS[i % INC_COLORS.length] : '#C3CDDC'; }
function monthInc_() { return S.data.incomes.filter(function (r) { return r.date.slice(0, 7) === S.month; }); }
function lastIncCat_() {
  var v = '';
  try { v = localStorage.getItem('ldg_inc_last') || ''; } catch (e) {}
  if (v && S.data.incCats.indexOf(v) >= 0) return v;
  var last = S.data.incomes[S.data.incomes.length - 1];
  return last && S.data.incCats.indexOf(last.category) >= 0 ? last.category : S.data.incCats[0];
}
/* 최근 기록에서 분류+금액 짝을 겹치지 않게 최대 4개 */
function recentInc_() {
  var seen = {}, out = [];
  S.data.incomes.slice().reverse().some(function (r) {
    var k = r.category + '|' + r.amount;
    if (!seen[k]) { seen[k] = 1; out.push(r); }
    return out.length >= 4;
  });
  return out;
}
function renderIncome() {

  /* 분류별 이번 달 합계·건수 */

  var order = S.data.incCats.filter(function (c) { return by[c]; }).concat(Object.keys(by).filter(function (c) { return S.data.incCats.indexOf(c) < 0; }));
  html += '<div class="rhead">' + mm + '월 분류별</div><div class="panel" style="padding:4px 14px">';
  if (!order.length) html += '<div class="empty" style="padding:20px 0">이 달 수입이 없습니다.<br>들어올 때마다 + 로 금액만 넣으면 돼요.</div>';
  order.forEach(function (c, i) {

      '<i style="width:10px;height:10px;border-radius:3px;flex:none;background:' + incColor_(c) + '"></i>' +
      '<span style="flex:1;font-weight:700;font-size:15px">' + esc(c) + '<span style="font-weight:500;color:var(--ink-dim);font-size:12.5px;margin-left:6px">' + by[c].n + '건</span></span>' +
      '<b style="font-variant-numeric:tabular-nums;color:var(--go)">' + won(by[c].sum) + '</b></div>';
  });
  html += '</div>';

  var rows = list.slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  if (rows.length) html += '<div class="rhead" style="margin-top:20px">' + mm + '월 수입 내역<span class="cnt">' + rows.length + '건</span></div>';
  rows.forEach(function (r) {
    html += '<button class="rec" data-inc="' + r.id + '" style="border-left-color:' + incColor_(r.category) + '"><div class="rtop"><h2>' + esc(r.memo || r.category || '수입') + '</h2>' +
      '<span class="amt" style="color:var(--go)">+' + won(r.amount) + '</span></div><div class="meta">' +
      [dayLabel(r.date), esc(r.category || '분류 없음')].join('<span class="sep">|</span>') + '</div></button>';
  });
  html += '<div style="height:6px"></div>' +
          '<p class="note">통장에 실제로 들어온 금액(세후)을 적어요. 조사비처럼 매주 들어오는 건 들어올 때마다 한 줄씩 넣으면 월 합계가 자동으로 나와요.</p>';
  $('view').innerHTML = html;
  qa('#view [data-inc]').forEach(function (b) { b.onclick = function () { openInc(b.dataset.inc); }; });
}
function openInc(id) {

      '<label style="margin:0;flex:1.4"><span class="lbl">메모 · 선택</span><input type="text" id="iMemo" placeholder="예: 3주차 조사비" value="' + esc(r ? r.memo : '') + '"></label></div>' +
    '<div class="actions">' + (r ? '<button class="del" id="iDel">삭제</button>' : '') +
    '<button class="ghost" id="iClose">닫기</button><button id="iSave">저장</button></div>';
  openSheet(html);
  var ai = $('iAmt');
  ai.oninput = function () { var n = ai.value.replace(/\D/g, ''); ai.value = n ? fmt(Number(n)) : ''; };
  if (!r) setTimeout(function () { ai.focus(); }, 200);
  seg('iCat', function (v) { st.cat = v; });
  qa('#iRecent [data-i]').forEach(function (b) {
    b.onclick = function () {
      var x = recent[+b.dataset.i];
      ai.value = fmt(x.amount); st.cat = x.category;
      qa('#iCat button').forEach(function (c) { c.classList.toggle('sel', c.dataset.v === x.category); });
      qa('#iRecent button').forEach(function (c) { c.classList.toggle('sel', c === b); });
    };
  });
  $('iClose').onclick = closeSheet;
  $('iSave').onclick = function () {
    var d = { id: r ? r.id : newCid_(), date: $('iDate').value, category: st.cat, amount: num_(ai.value), memo: $('iMemo').value.trim(), rec: r ? (r.rec || '') : '' };
    if (!d.amount) { toast('금액을 입력하세요'); return; }
    if (!d.date) { toast('날짜를 고르세요'); return; }
    try { localStorage.setItem('ldg_inc_last', d.category); } catch (e) {}
    closeSheet();
    queueWrite_({ fn: 'saveInc', data: d });
    toast(r ? '수정했습니다' : d.category + ' ' + fmt(d.amount) + '원 추가했습니다');
  };
  if (r) sureDel('iDel', function () { closeSheet(); queueWrite_({ fn: 'delInc', id: r.id }); toast('삭제했습니다'); });
}

/* ---------- 카드값 (청구 기준) ----------
   쓴 돈(내역·통계)은 산 날 기준 전체 금액. 카드값은 카드별 이용기간에 맞춰 이번에 청구될 금액을 따로 계산한다.
   이용기간: 시작일 ~ 다음 달 시작일 전날. 결제일: 이용기간이 끝난 뒤 처음 오는 결제일.
   (예: 현대 시작일 13·결제일 23 → 10/13~11/12 이용분을 11/23에 청구) */
function d2s_(dt) { return dt.getFullYear() + '-' + ('0' + (dt.getMonth() + 1)).slice(-2) + '-' + ('0' + dt.getDate()).slice(-2); }
function dayIn_(y, m, day) { var last = new Date(y, m, 0).getDate(); return new Date(y, m - 1, Math.min(day, last)); }   /* m: 1~12 */
function addYm_(ym, n) { var y = +ym.slice(0, 4), m = +ym.slice(5) - 1 + n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + '-' + ('0' + (m + 1)).slice(-2); }
function ymDiff2_(a, b) { return (+b.slice(0, 4) * 12 + +b.slice(5)) - (+a.slice(0, 4) * 12 + +a.slice(5)); }
function billReady_(c) { return c && c.payDay > 0 && c.startDay > 0; }
/* 이용기간이 y년 m월 시작일에 시작하는 청구 */
function stmtFrom_(c, y, m) {
  var start = dayIn_(y, m, c.startDay);
  var nm = m === 12 ? [y + 1, 1] : [y, m + 1];
  var end = new Date(dayIn_(nm[0], nm[1], c.startDay).getTime() - 86400000);
  var pay = dayIn_(end.getFullYear(), end.getMonth() + 1, c.payDay);
  if (pay <= end) { var pm = end.getMonth() + 2, py = end.getFullYear(); if (pm > 12) { pm = 1; py++; } pay = dayIn_(py, pm, c.payDay); }
  return { start: d2s_(start), end: d2s_(end), pay: d2s_(pay), key: d2s_(pay).slice(0, 7) };
}
/* 어떤 날짜의 결제가 들어가는 청구 */
function stmtOfDate_(c, ds) {
  var y = +ds.slice(0, 4), m = +ds.slice(5, 7);
  for (var k = 0; k >= -2; k--) {
    var mm = m + k, yy = y; if (mm < 1) { mm += 12; yy--; }
    var s = stmtFrom_(c, yy, mm);
    if (s.start <= ds && ds <= s.end) return s;
  }
  return stmtFrom_(c, y, m);
}
/* 오늘 이후 처음 결제되는 청구 */
function nextStmt_(c) {
  var today = S.data.now.slice(0, 10), y = +today.slice(0, 4), m = +today.slice(5, 7), best = null;
  for (var k = -3; k <= 2; k++) {
    var mm = m + k, yy = y; while (mm < 1) { mm += 12; yy--; } while (mm > 12) { mm -= 12; yy++; }
    var s = stmtFrom_(c, yy, mm);
    if (s.pay >= today && (!best || s.pay < best.pay)) best = s;
  }
  return best;
}
/* 카드 한 장의 청구 계산. st: 청구(없으면 결제일 미설정 → 이번 달 기준 할부만) */
function billOf_(c, st) {
  var key = st ? st.key : S.data.now.slice(0, 7), out = { lump: 0, lumpN: 0, inst: 0, rows: [], carry: 0 };
  S.data.txs.forEach(function (t) {
    if (t.eCard !== c.name) return;
    var d = t.when.slice(0, 10);
    if (t.inst >= 2 && t.type === '승인') {
      if (!st) return;
      var k0 = stmtOfDate_(c, d).key, n = ymDiff2_(k0, key) + 1;
      if (n >= 1 && n <= t.inst) {
        var per = Math.round(t.amount / t.inst);
        out.inst += per;
        out.rows.push({ name: cleanMemo(t.memo) || t.eCat || '할부', n: n, total: t.inst, amt: per, left: per * (t.inst - n), txid: t.id });
      }
      return;
    }
    if (st && st.start <= d && d <= st.end) { out.lump += t.sign * t.amount; out.lumpN++; }
  });
  S.data.insts.filter(function (i) { return i.card === c.name; }).forEach(function (i) {
    var n = ymDiff2_(i.first, key) + 1;
    if (n >= 1 && n <= i.total) { out.inst += i.monthly; out.rows.push({ name: i.name, n: n, total: i.total, amt: i.monthly, left: i.monthly * (i.total - n), instid: i.id }); }
  });
  if (c.carry && c.carryMonth === key) out.carry = c.carry;
  out.calc = out.lump + out.inst;          /* 가계부로 계산한 금액 */
  out.total = out.calc + out.carry;        /* + 이월금액 */
  return out;
}
function mdLabel_(ds) { return Number(ds.slice(5, 7)) + '/' + Number(ds.slice(8, 10)); }
function billHtml_() {
  var cards = S.data.cards, list = monthTx(), mm = Number(S.month.slice(5));
  var items = cards.map(function (c) { var st = billReady_(c) ? nextStmt_(c) : null; return { c: c, st: st, b: billOf_(c, st) }; });
  items.sort(function (a, b) { return (a.st ? a.st.pay : '9') < (b.st ? b.st.pay : '9') ? -1 : 1; });
  var sumAll = items.reduce(function (a, x) { return a + (x.st ? x.b.total : 0); }, 0);
  var html = '<div class="rhead">내 카드<span class="cnt">다음 카드값 합계 ' + won(sumAll) + '</span></div>';
  if (!cards.length) html += '<div class="empty" style="padding:26px 0">아래 + 로 카드를 추가하세요.</div>';
  items.forEach(function (x) {
    var c = x.c, st = x.st, b = x.b;
    html += '<div class="crec" style="padding:13px 14px">' +
      '<div class="chead"><h2>' + esc(c.name) + '</h2><button class="edit" data-id="' + c.id + '">수정</button></div>';
    if (st) {
      var parts = ['일시불 ' + won(b.lump)];
      if (b.inst) parts.push('할부 ' + won(b.inst));
      if (b.carry) parts.push('이월 ' + won(b.carry));
      html += '<div style="display:flex;align-items:baseline;gap:8px;margin-top:6px"><span class="meta" style="flex:1;margin:0"><b>' + mdLabel_(st.pay) + ' 결제</b><span class="sep">|</span>이용 ' + mdLabel_(st.start) + '~' + mdLabel_(st.end) + '</span>' +
              '<b style="font-size:18px;font-variant-numeric:tabular-nums">' + won(b.total) + '</b></div>' +
              '<div class="meta" style="white-space:normal">' + parts.join(' · ') + ' <button class="ghost" data-billfix="' + c.id + '" style="margin-left:4px;min-height:28px;padding:0 9px;font-size:12px;border-radius:8px">금액 맞추기</button></div>';
    } else {
      html += '<div class="meta" style="white-space:normal;margin-top:6px"><b class="no">결제일 없음</b> · ‘수정’에서 결제일·이용기간 시작일을 넣으면 카드값이 계산돼요.' + (b.inst ? ' (할부 이번 회차 ' + won(b.inst) + ')' : '') + '</div>';
    }
    /* 이달 실적 (1일~말일) */
    var used = sum(list.filter(function (t) { return t.eCard === c.name && !t.excl; }));
    html += '<div style="margin-top:10px;padding-top:9px;border-top:1px solid #ECF1F7"><div style="display:flex;justify-content:space-between;font-size:13px">' +
            '<span style="color:var(--ink-mid);font-weight:600">' + mm + '월 실적</span><span style="font-variant-numeric:tabular-nums"><b>' + won(used) + '</b>' + (c.target ? ' / ' + won(c.target) : '') + '</span></div>';
    if (c.target) {
      var pct = Math.max(0, Math.min(100, used / c.target * 100));
      html += '<div class="track" style="margin-top:6px"><div class="fill" style="width:' + pct + '%;' + (used >= c.target ? 'background:var(--go)' : '') + '"></div></div>' +
              '<div class="bf"><span>' + Math.floor(used / c.target * 100) + '%</span>' + (used >= c.target ? '<span class="done">달성</span>' : '<span>' + won(c.target - used) + ' 남음</span>') + '</div>';
    }
    html += '</div></div>';
  });
  var names = {};
  cards.forEach(function (c) { names[c.name] = 1; });
  var nc = list.filter(function (t) { return !names[t.eCard]; });
  if (nc.length) html += '<div class="meta" style="margin:2px 4px 0;white-space:normal"><b class="no">카드 미지정 ' + nc.length + '건 ' + won(sum(nc)) + '</b> — 실적·카드값에서 빠져 있어요. 내역에서 카드를 골라 주세요.</div>';
  html += '<p class="note">카드값: 이용기간 결제(할부는 이번 회차) + 등록한 할부 + 이월금액. 실적: ' + mm + '월 1일~말일 결제 기준 추정(‘실적 제외’ 결제 빼고). 카드사 규정에 따라 조금 다를 수 있어요.</p>';

  /* 진행 중인 할부 */
  var rows = [];
  items.forEach(function (x) { x.b.rows.forEach(function (r) { rows.push({ r: r, c: x.c, st: x.st }); }); });
  html += '<div class="rhead">진행 중인 할부<span class="cnt">' + rows.length + '건</span></div>';
  rows.forEach(function (o) {
    var r = o.r;
    html += '<button class="rec" ' + (r.instid ? 'data-instedit="' + r.instid + '"' : 'data-insttx="' + r.txid + '"') + ' style="border-left-color:var(--blue)"><div class="rtop"><h2>' + esc(r.name) + '</h2>' +
            '<span class="amt">' + won(r.amt) + '</span></div><div class="meta">' +
            [esc(o.c.name), r.n + '/' + r.total + '회차', '남은 ' + won(r.left)].join('<span class="sep">|</span>') + '</div></button>';
  });
  html += '<button class="ghost" id="instAdd" style="width:100%;min-height:46px;margin:2px 0 6px">+ 진행 중인 할부 등록</button>';
  return html;
}
function bindBill_() {
  qa('#view [data-billfix]').forEach(function (b) { b.onclick = function () { openCarry(b.dataset.billfix); }; });
  qa('#view [data-instedit]').forEach(function (b) { b.onclick = function () { openInst(b.dataset.instedit); }; });
  qa('#view [data-insttx]').forEach(function (b) { b.onclick = function () { openTx(b.dataset.insttx); }; });

function cardSaveData_(c, over) {
  var d = { id: c.id, name: c.name, last4: c.last4, target: c.target, keywords: c.keywordText, payDay: c.payDay, startDay: c.startDay, carry: c.carry, carryMonth: c.carryMonth };
  for (var k in over || {}) d[k] = over[k];
  return d;
}
/* 카드사 앱의 결제예정금액을 넣으면, 가계부 계산과의 차이를 이월금액으로 저장 */
function openCarry(id) {
  var c = S.data.cards.filter(function (x) { return x.id === id; })[0];
  if (!c) return;
  var st = nextStmt_(c), b = billOf_(c, st);
  var html = '<h2>' + esc(c.name) + ' 금액 맞추기</h2>' +
    '<p class="lead">' + mdLabel_(st.pay) + ' 결제(이용 ' + mdLabel_(st.start) + '~' + mdLabel_(st.end) + ') 기준이에요. 카드사 앱의 결제예정금액을 넣으면, 가계부에 없는 차액을 이월금액으로 넣어 둡니다.</p>' +
    '<div class="raw" style="font-size:14px;line-height:1.9;color:var(--ink)">가계부로 계산한 금액 <b style="float:right">' + won(b.calc) + '</b><br>' +
      '<span style="color:var(--ink-mid)">일시불 ' + won(b.lump) + ' · 할부 ' + won(b.inst) + '</span><br>' +
      '지금 이월금액 <b style="float:right">' + won(b.carry) + '</b></div>' +
    '<label style="margin-top:16px"><span class="lbl">카드사 앱의 결제예정금액 (원)</span><input type="text" class="big" id="kAmt" inputmode="numeric" placeholder="0" value="' + (b.total ? fmt(b.total) : '') + '"></label>' +
    '<div class="memo" id="kInfo"></div>' +
    '<div class="actions">' + (b.carry ? '<button class="del" id="kDel" style="flex:0 0 96px">이월 지우기</button>' : '') +
    '<button class="ghost" id="kClose">닫기</button><button id="kSave">저장</button></div>';
  openSheet(html);
  var ki = $('kAmt');
  function info() {
    var v = num_(ki.value), diff = v - b.calc;
    $('kInfo').textContent = !v ? '금액을 넣어 주세요.' : diff === 0 ? '가계부 계산과 같아요. 이월금액은 0원이 됩니다.'
      : diff > 0 ? '이월금액 ' + fmt(diff) + '원으로 저장됩니다.' : '카드사 금액이 가계부보다 ' + fmt(-diff) + '원 적어요. 취소·환불이 빠졌는지 확인해 보세요. 그래도 저장하면 이월금액이 −' + fmt(-diff) + '원이 됩니다.';
  }

/* ---------- 가계부.md 가져오기 ---------- */
/* 한 줄 모양: - 2026-10-19 22:24:07 | KBPay | 4730 | 승인 | 식비 | 메모 | 알림 원문 */
function parseMd(text) {
  var out = [], last = null;
  /* 현대카드 알림은 줄바꿈이 \n 이 아니라 \r 이나 유니코드 줄 구분자(U+2028)로 들어온다. 전부 줄바꿈으로 본다 */
  String(text || '').split(/\r\n|\r|\n|\u2028|\u2029|\u0085/).forEach(function (line) {
    var m = line.match(/^\s*-\s*(\d{4}-\d{2}-\d{2}\s+\d{1,2}:\d{2}(?::\d{2})?)\s*\|(.*)$/);
    if (!m) {
      /* 현대카드처럼 알림이 여러 줄이면 다음 줄들을 앞 기록의 원문에 이어 붙인다 */
      var s = line.trim();
      if (last && s && s.charAt(0) !== '#') last.raw = (last.raw + ' ' + s).slice(0, 160);
      else if (!s) last = null;
      return;
    }
    last = null;
    var p = m[2].split('|').map(function (x) { return x.trim(); });
    var amount = Number(String(p[1] || '').replace(/[^\d]/g, ''));
    if (!amount) return;
    last = {
      when: m[1].replace(/\s+/, ' '), app: p[0] || '', amount: amount,
      type: (p[2] || '').indexOf('취소') >= 0 ? '취소' : '승인',
      category: p[3] || '미분류', memo: (p[4] && p[4] !== '-') ? p[4] : '',
      raw: p.slice(5).join(' | ').slice(0, 160)
    };
    out.push(last);
  });
  return out;
}

    if (!f) return;
    var r = new FileReader();
    r.onload = function () { $('iText').value = r.result; update(r.result); };
    r.readAsText(f, 'utf-8');
  };
  $('iText').oninput = function () { update(this.value); };
  $('iClose').onclick = closeSheet;
  $('iGo').onclick = function () {
    var btn = this, list = found.slice(), total = list.length;
    var n = { added: 0, skipped: 0, ignored: 0, orphan: 0, removed: 0 }, addedList = [];
    btn.disabled = true;
    (function next() {
      if (!list.length) {
        btn.disabled = false; closeSheet();
        var why = [];
        if (n.skipped) why.push('이미 있음 ' + n.skipped);
        if (n.removed) why.push('앱에서 지운 결제 ' + n.removed);
        if (n.ignored) why.push('카드대금 ' + n.ignored);
        if (n.orphan) why.push('원래 결제가 없는 취소 ' + n.orphan);
        if (!addedList.length) { toast('놓친 결제가 없어요. 모두 앱에 있습니다.' + (why.length ? '\n(뺀 것: ' + why.join(', ') + ')' : ''), 5000); return; }
        /* 단축어가 서버로 못 보냈던 결제를 알려 준다 */
        var tot = addedList.reduce(function (a, x) { return a + (x.type === '취소' ? -x.amount : x.amount); }, 0);
        openSheet('<h2>놓친 결제 ' + addedList.length + '건을 넣었어요</h2>' +
          '<p class="lead">가계부.md에는 있는데 앱에 없던 결제예요. 그때 인터넷이 끊겼거나 단축어가 서버에 못 보낸 것들이에요. 미분류로 들어갔으니 내역 맨 위에서 분류해 주세요.</p>' +
          '<div class="raw" style="font-size:13.5px;line-height:1.85;color:var(--ink)">' + addedList.map(function (x) {
            return x.when.slice(5, 16).replace('-', '/') + ' · ' + (x.type === '취소' ? '취소 −' : '') + fmt(x.amount) + '원 · ' + esc(x.card || x.app) + (shopOf_({ raw: x.raw }) ? ' · ' + esc(shopOf_({ raw: x.raw })) : '');
          }).join('<br>') + '<br><b>합계 ' + fmt(tot) + '원</b></div>' +
          (why.length ? '<p class="note" style="margin-top:10px">뺀 것: ' + why.join(', ') + '</p>' : '') +
          '<div class="actions"><button id="impOk">확인</button></div>');
        $('impOk').onclick = function () { closeSheet(); S.tab = 'list'; S.filter = 'all'; render(); };
        return;
      }
      /* 서버 주소가 너무 길어지지 않게, 한글이 많은 줄(현대카드 여러 줄 알림 등)은 적게 묶어 보낸다 */
      var chunk = [list.shift()];
      while (list.length && encodeURIComponent(JSON.stringify(chunk.concat([list[0]]))).length <= 1500) chunk.push(list.shift());
      btn.textContent = '넣는 중… ' + (total - list.length) + ' / ' + total;
      callServer({ fn: 'importTx', data: JSON.stringify(chunk) }, function (res) {
        for (var k in n) n[k] += res[k] || 0;
        if (res.addedList) addedList = addedList.concat(res.addedList);
        setData(res); next();
      }, function (err) {
        btn.disabled = false; btn.textContent = '가져오기';
        if (err === 'TIMEOUT') err = '서버 답이 늦습니다';
        toast('실패: ' + err + '\n(' + chunk[0].when.slice(5, 16) + ' ' + chunk[0].app + ' 줄에서 멈춤)\n여기까지 ' + n.added + '건은 들어갔습니다. 다시 누르면 이어서 넣습니다.', 7000);
      }, { timeout: 45000 });
    })();
  };
}

/* ---------- 서버 연결 설정 ---------- */
function openSetup(msg) {
  var first = !API || !CODE;
  var html = '<h2>' + (first ? '가계부 시작하기' : '서버 연결 설정') + '</h2>' +
    (msg ? '<div class="memo" style="background:var(--stop-bg);color:var(--stop);margin:-8px 0 16px">' + esc(msg) + '</div>' : '') +
    '<p class="lead">Apps Script 웹앱 주소와 setup 실행 때 나온 비밀키를 넣어 주세요. 이 기기에만 저장되고, 한 번 넣으면 다시 묻지 않습니다.</p>' +
    '<label><span class="lbl">서버 주소</span><input type="text" id="sApi" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(API) + '" autocapitalize="off" autocorrect="off"></label>' +
    '<label><span class="lbl">비밀키</span><input type="text" id="sCode" placeholder="16자리" value="' + esc(CODE) + '" autocapitalize="off" autocorrect="off"></label>' +
    '<div class="actions">' + (first ? '' : '<button class="ghost" id="sClose">닫기</button>') + '<button id="sSave">연결</button></div>';
  openSheet(html);
  if (!first) $('sClose').onclick = closeSheet;
  $('sSave').onclick = function () {
    var u = $('sApi').value.trim(), k = $('sCode').value.trim();
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(u)) { toast('주소는 https://script.google.com/macros/s/…/exec 모양이어야 합니다.', 5000); return; }
    if (!k) { toast('비밀키를 입력하세요'); return; }
    API = u; CODE = k;
    try { localStorage.setItem('ldg_api', u); localStorage.setItem('ldg_code', k); } catch (e) {}
    api('all', {}, { busy: true }).then(function (ok) { if (ok) { closeSheet(); toast('연결했습니다'); checkVersion_(true); } });
  };
}

/* ---------- 공통 ---------- */
function seg(id, onPick) {
  qa('#' + id + ' button').forEach(function (b) {
    b.onclick = function () {
      qa('#' + id + ' button').forEach(function (x) { x.classList.remove('sel'); });
      b.classList.add('sel'); onPick(b.dataset.v);
    };
  });
}
function sureDel(id, action) {
  var b = $(id), timer;
  b.onclick = function () {
    if (!b.classList.contains('sure')) {
      b.classList.add('sure'); b.textContent = '정말 삭제';
      timer = setTimeout(function () { b.classList.remove('sure'); b.textContent = '삭제'; }, 3000);
      return;
    }
    clearTimeout(timer); action();
  };
}
function openSheet(html) { var s = $('sheet'); s.innerHTML = html; s.scrollTop = 0; s.classList.add('open'); }
function closeSheet() { $('sheet').classList.remove('open'); }
function switchTab(tab) { S.tab = tab; S.filter = 'all'; render(); window.scrollTo(0, 0); }
function shiftMonth(d) {
  var y = Number(S.month.slice(0, 4)), m = Number(S.month.slice(5)) - 1 + d;
  var dt = new Date(y, m, 1);
  S.month = dt.getFullYear() + '-' + ('0' + (dt.getMonth() + 1)).slice(-2);
  S.filter = 'all'; render(); window.scrollTo(0, 0);
}
function dayLabel(ds) {
  var d = new Date(ds + 'T00:00:00');
  var w = ['일', '월', '화', '수', '목', '금', '토'][d.getDay()];
  var base = Number(ds.slice(5, 7)) + '.' + Number(ds.slice(8, 10)) + ' (' + w + ')';
  var t = S.data.now.slice(0, 10);
  if (ds === t) return base + ' 오늘';
  if ((new Date(t + 'T00:00:00') - d) === 86400000) return base + ' 어제';
  return base;
}
function fmt(n) { return Math.round(n).toLocaleString('ko-KR'); }
function won(n, big) { return fmt(n) + (big ? '<small>원</small>' : '원'); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
var toastTimer;
function toast(msg, ms) {
  var t = $('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.display = 'none'; }, ms || 2200);
}
function $(id) { return document.getElementById(id); }
function qa(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }

$('prev').onclick = function () { if (S.data) shiftMonth(-1); };
$('next').onclick = function () { if (S.data) shiftMonth(1); };
$('fab').onclick = function () { if (!S.data) return; if (S.tab === 'cards') openCard(''); else if (S.tab === 'loans') openLoan(''); else if (S.tab === 'inc') openInc(''); else openTx(''); };
qa('#tabs button').forEach(function (b) { b.onclick = function () { if (S.data) switchTab(b.dataset.tab); }; });

/* ---------- 비밀키가 틀렸을 때 ----------
   비밀키만 지우고 다시 묻는다. 서버 주소는 그대로 둔다. */
function authFail_() {
  CODE = '';
  try { localStorage.removeItem('ldg_code'); } catch (e) {}
  openSetup('비밀키가 맞지 않습니다. 다시 넣어 주세요.');
}

/* ---------- 판 번호 줄 ----------
   누르면: 자료를 다시 받고 새 버전이 있는지 본다. 새 버전이 있으면 바로 받는다.
   길게 누르면: 서버 주소·비밀키 바꾸기, 앱 다시 받기. (오늘병원과 같은 동작) */
var NEW_VER = '', VER_STATE = '확인 전', verBusy = false, LAST_LOAD = 0, SW_ON = false;
function verLineHtml_(state) {
  return '<b>↻ 새로고침</b>가계부 ' + APP_VER + ' · 서버 ' + (S.data && S.data.serverVer ? 'S' + S.data.serverVer : '확인 전') + ' · ' + esc(state || VER_STATE) +
         '<span class="vsub">누르면 새로고침 · 새 버전 확인</span>';
}
function verPaint_(state) { var el = $('verLine'); if (el) el.innerHTML = verLineHtml_(state); }
function verDone_(txt) { VER_STATE = txt; verBusy = false; verPaint_(txt); }
function bindVer_(el) {
  var timer = null, longed = false;
  function start() { longed = false; timer = setTimeout(function () { longed = true; openSettings_(); }, 600); }
  function stop() { clearTimeout(timer); }
  el.addEventListener('touchstart', start, { passive: true });
  el.addEventListener('touchend', stop);
  el.addEventListener('touchmove', stop, { passive: true });
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', stop);
  el.addEventListener('mouseleave', stop);
  el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  el.onclick = function () { if (longed) { longed = false; return; } verTap_(); };
}
function verTap_() {
  if (NEW_VER) { doUpdate_(); return; }
  verPaint_('불러오는 중…');
  api('all', {}, { quiet: true }).then(function (ok) {
    toast(ok ? '새로 불러왔습니다' : '불러오지 못했습니다');
    if (!verBusy) checkVersion_(false);
  });
}
/* 설정: 자주 안 쓰는 것들을 한 곳에 (카드 탭 맨 아래 ⚙ 설정, 또는 판 번호 줄 길게 누르기) */
function openSettings_() {
  openSheet('<h2>설정</h2>' +
    '<button class="ver" id="verLine" style="margin:0 0 14px">' + verLineHtml_() + '</button>' +
    '<div class="rhead" style="margin-top:0">분류</div><div class="menu">' +
    '<button id="sExp" class="ghost">지출 분류 편집<small>' + S.data.categories.map(esc).join(' · ') + '</small></button>' +
    '<button id="sInc" class="ghost">수입 분류 편집<small>' + S.data.incCats.map(esc).join(' · ') + '</small></button></div>' +
    '<div class="rhead">자료</div><div class="menu">' +
    '<button id="sImp" class="ghost">가계부.md 가져오기<small>단축어가 서버로 못 보낸 결제를 채워 넣기 (같은 건은 건너뜀)</small></button></div>' +
    '<div class="rhead">연결</div><div class="menu">' +
    '<button id="mSetup" class="ghost">서버 주소·비밀키 바꾸기<small>연결이 안 될 때</small></button>' +
    '<button id="mReset" class="ghost">앱 다시 받기<small>새 버전으로 안 바뀔 때. 기록은 구글 시트에 있어 지워지지 않습니다.</small></button></div>' +
    '<div class="actions"><button class="ghost" id="mClose">닫기</button></div>');
  bindVer_($('verLine'));
  $('sExp').onclick = function () { openCats('exp'); };
  $('sInc').onclick = function () { openCats('inc'); };
  $('sImp').onclick = openImport;
  $('mClose').onclick = closeSheet;
  $('mSetup').onclick = function () { openSetup(); };
  $('mReset').onclick = function () {
    try { localStorage.removeItem(UPD_KEY); localStorage.removeItem('ldg_cache'); } catch (e) {}
    swKill_(function () { goVersion_('t'); });
  };
}
function openMenu_() {
  openSheet('<h2>설정</h2><div class="menu">' +
    '<button id="mSetup" class="ghost">서버 주소·비밀키 바꾸기<small>연결이 안 될 때</small></button>' +
    '<button id="mReset" class="ghost">앱 다시 받기<small>새 버전으로 안 바뀔 때. 기록은 구글 시트에 있어 지워지지 않습니다.</small></button>' +
    '</div><div class="actions"><button class="ghost" id="mClose">닫기</button></div>');
  $('mClose').onclick = closeSheet;
  $('mSetup').onclick = function () { openSetup(); };
  $('mReset').onclick = function () {
    try { localStorage.removeItem(UPD_KEY); localStorage.removeItem('ldg_cache'); } catch (e) {}
    swKill_(function () { goVersion_('t'); });
  };
}

/* ---------- 새 판 확인 ----------
   홈 화면 아이콘으로 연 앱은 예전 파일을 붙들고 있어서 깃허브에 올려도 안 바뀐다.
   켤 때 원본을 한 번 들여다보고, 판 번호가 높으면 스스로 새로 받는다. */
function appBase_() { return location.origin + location.pathname; }
function checkVersion_(auto) {
  if (!window.fetch || location.protocol !== 'https:') { verDone_('최신'); return; }
  verBusy = true; verPaint_('확인 중…');
  var done = false;
  var timer = setTimeout(function () { finish('확인 못 함'); }, 9000);
  function finish(t) { if (done) return; done = true; clearTimeout(timer); verDone_(t); }
  fetch(appBase_() + '?upd=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (t) {
      var m = t.match(/APP_VER = '(v[0-9]+)'/);
      if (!m) { finish('확인 못 함'); return; }
      if (Number(m[1].slice(1)) <= Number(APP_VER.slice(1))) {
        try { localStorage.removeItem(UPD_KEY); } catch (e) {}
        finish('최신'); return;
      }
      NEW_VER = m[1];
      finish(NEW_VER + ' 나옴');
      if (auto) autoUpdate_(NEW_VER); else showUpdBar_();
    })
    .catch(function () { finish('확인 못 함'); });
}
function showUpdBar_(stuck) {
  $('updTxt').textContent = stuck ? ('새 버전(' + NEW_VER + ')으로 안 바뀝니다. 눌러 주세요.')
                                  : ('새 버전이 나왔습니다 (' + APP_VER + ' → ' + NEW_VER + ')');
  $('upd').classList.add('on');
}
/* 같은 판으로 두 번 시도해도 안 바뀌면 더 돌지 않고 단추를 띄운다 */
var UPD_KEY = 'ldg_upd';
function autoUpdate_(ver) {
  if ($('sheet').classList.contains('open')) { showUpdBar_(); return; }   /* 입력 중이면 건드리지 않는다 */
  var now = Date.now(), st = null;
  try { st = JSON.parse(localStorage.getItem(UPD_KEY) || 'null'); } catch (e) {}
  var same = st && st.ver === ver && (now - st.t) < 180000;
  if (same && st.n >= 2) { showUpdBar_(true); return; }
  try { localStorage.setItem(UPD_KEY, JSON.stringify({ ver: ver, t: now, n: same ? st.n + 1 : 1 })); } catch (e) {}
  toast('새 버전 ' + ver + ' 을 받는 중…', 2500);
  setTimeout(function () { goVersion_(ver); }, 700);
}
function goVersion_(ver) { location.replace(appBase_() + '?v=' + ver + '&t=' + Date.now()); }
function doUpdate_() { $('upd').classList.remove('on'); goVersion_(NEW_VER || 't'); }
$('updBtn').onclick = doUpdate_;

/* ---------- 파일 지킴이(서비스워커) ---------- */
function swStart_() {
  if (!('serviceWorker' in navigator) || location.protocol !== 'https:') return;
  try {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .then(function (reg) { SW_ON = true; try { reg.update(); } catch (e) {} })
      .catch(function () {});
  } catch (e) {}
}
function swKill_(done) {
  var fin = function () { try { done(); } catch (e) {} };
  var jobs = [];
  try { if ('serviceWorker' in navigator) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (e) {}
  try { if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
  if (!jobs.length) { fin(); return; }
  Promise.all(jobs).then(fin, fin);
  setTimeout(fin, 2500);
}

/* ---------- 다시 켤 때 새로 받아오기 ----------
   아이콘으로 띄운 앱은 꺼도 메모리에 남아 있어서 스스로 다시 읽지 않는다.
   다른 앱(결제·단축어)에 갔다가 돌아오면 받아온다. 15초 안에 받았으면 건너뛴다. */
function resumeLoad_() {
  if (!document.hidden) wqRun_();
  if (document.hidden || !API || !CODE || BUSY > 0) return;
  if ($('sheet').classList.contains('open')) return;
  if (Date.now() - LAST_LOAD < 15000) return;
  api('all', {}, { quiet: true });
}
document.addEventListener('visibilitychange', resumeLoad_);
window.addEventListener('pageshow', resumeLoad_);
window.addEventListener('focus', resumeLoad_);

/* ---------- 시작 ----------
   기기에 담아 둔 자료를 먼저 그려서 기다림 없이 띄우고, 새 자료는 뒤에서 받아 바꿔 끼운다. */
swStart_();
(function boot() {
  if (!API || !CODE) { openSetup(); return; }
  try {
    var c = JSON.parse(localStorage.getItem('ldg_cache') || 'null');
    if (c && c.txs instanceof Array && c.cards instanceof Array) setData(c, true);
  } catch (e) {}
  api('all', {}, { quiet: !!S.data }).then(function (ok) {
    if (!ok && !S.data) {
      $('view').innerHTML = '<div class="empty">불러오지 못했습니다.<br><br><button class="ghost" id="retry">다시 불러오기</button> <button id="goSetup">연결 설정</button></div>';
      $('retry').onclick = function () { location.reload(); };
      $('goSetup').onclick = function () { openSetup(); };
    }
    checkVersion_(true);
    wqRun_();   /* 지난번에 못 보낸 저장이 있으면 이어서 */
  });
})();
</script>
</body>
</html>
