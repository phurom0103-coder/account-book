<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>가계부</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16243D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="가계부">
<style>
  /* 오늘병원과 같은 색·모양 */
  :root {
    --head:      #16243D;
    --blue:      #2D5BD7;
    --blue-dk:   #1E48B4;
    --blue-tint: #E8EFFD;

    --ink:      #141C2B;
    --ink-mid:  #5A6880;
    --ink-dim:  #8B96AA;
    --paper:    #F2F5FA;
    --surface:  #FFFFFF;
    --rule:     #DFE5EF;

    --go:      #1B7A43;
    --go-bg:   #E6F3EA;
    --stop:    #B3261E;
    --stop-bg: #FBEAE8;
    --wait:    #4A5B6E;
    --wait-bg: #EBEFF3;

    --shadow: 0 1px 2px rgba(16,28,50,.05), 0 4px 14px rgba(16,28,50,.07);
    --tabh:   62px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: var(--paper); color: var(--ink);
    font-size: 15px; line-height: 1.45;
    padding-bottom: calc(var(--tabh) + 96px);
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--blue-dk); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- 상단 ---------- */
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--head); color: #fff;
    padding: calc(10px + env(safe-area-inset-top)) 16px 14px;
    border-radius: 0 0 20px 20px;
  }
  .hrow { display: flex; align-items: center; gap: 4px; }
  .hrow h1 { flex: 1; margin: 0; text-align: center; font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
  .hbtn {
    width: 40px; height: 40px; padding: 0; border-radius: 12px;
    background: rgba(255,255,255,.1); color: #fff; display: grid; place-items: center;
  }
  .hbtn svg { width: 20px; height: 20px; }
  .hsum { text-align: center; margin: 8px 0 12px; }
  .hsum .hl { font-size: 12.5px; opacity: .72; }
  .hsum .ht { font-size: 30px; font-weight: 800; letter-spacing: -.03em; margin-top: 1px; }
  .hsum .ht small { font-size: 17px; font-weight: 700; margin-left: 2px; }
  .rbar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .rbar button, .rbar > span {
    padding: 7px 12px; border: none; border-radius: 999px;
    font-size: 13px; font-weight: 700; letter-spacing: -0.2px;
    background: rgba(255,255,255,.16); color: #fff; white-space: nowrap;
  }
  .rbar button.on { background: #fff; color: var(--head); }
  .rbar .n { font-size: 11.5px; font-weight: 600; margin-left: 5px; opacity: .78; font-variant-numeric: tabular-nums; }
  .rbar .warn .n { color: #FFB4A9; opacity: 1; }
  .rbar .on.warn .n { color: var(--stop); }

  .wrap { padding: 16px 14px 0; }
  .empty { text-align: center; color: var(--ink-dim); padding: 46px 0; font-size: 14px; }

  /* ---------- 하단 탭 ---------- */
  #tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: flex; gap: 4px; background: var(--surface); border-top: 1px solid var(--rule);
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  }
  #tabs button {
    flex: 1; height: 44px; min-width: 0; background: none; color: var(--ink-mid);
    border-radius: 22px; font-size: 14px; font-weight: 500; padding: 0;
  }
  #tabs button.on {
    color: var(--blue-dk); font-weight: 700; background: var(--blue-tint);
    box-shadow: inset 0 0 0 1.5px var(--blue);
  }
  .tabcnt {
    display: none; margin-left: 5px; font-size: 11px; font-weight: 700;
    background: var(--stop); color: #fff; border-radius: 9px; padding: 1px 6px; vertical-align: 1px;
  }
  .tabcnt.show { display: inline-block; }

  /* ---------- 날짜 구분 ---------- */
  .dayhead {
    display: flex; align-items: baseline; gap: 9px; margin: 22px 4px 9px;
    font-size: 15px; font-weight: 700; letter-spacing: -.02em;
  }
  .dayhead:first-child { margin-top: 2px; }
  .dayhead .cnt { font-weight: 500; color: var(--ink-mid); font-size: 12.5px; }
  .dayhead .sum { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--ink-mid); }
  .dayhead.today { color: var(--blue-dk); }

  /* ---------- 거래 카드 ---------- */
  .rec {
    display: block; width: 100%; text-align: left;
    background: var(--surface); border-left: 5px solid #D8E0EC; border-radius: 13px;
    box-shadow: var(--shadow); padding: 11px 13px 10px; margin-bottom: 8px; color: var(--ink);
    font-weight: 400;
  }
  .rec:active { opacity: .7; }
  .rtop { display: flex; align-items: baseline; gap: 10px; }
  .rtop h2 {
    flex: 1; min-width: 0; margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .rtop .amt { font-size: 16px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .rtop .amt.minus { color: var(--go); }
  .meta { margin-top: 3px; font-size: 12.5px; color: var(--ink-mid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .sep { color: #C3CDDC; margin: 0 6px; }
  .meta b { font-weight: 700; }
  .meta b.no { color: var(--stop); }
  .meta b.yes { color: var(--go); }
  .tag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 7px; border-radius: 7px; margin-left: 6px; vertical-align: 1px; }
  .tag.no  { background: var(--stop-bg); color: var(--stop); }
  .tag.yes { background: var(--go-bg); color: var(--go); }
  .tag.wait { background: var(--wait-bg); color: var(--wait); }

  /* ---------- 통계 ---------- */
  .rhead { margin: 20px 3px 8px; font-size: 13px; font-weight: 800; color: var(--ink-mid); letter-spacing: -0.2px; }
  .rhead:first-child { margin-top: 3px; }
  .rhead .cnt { font-size: 11.5px; font-weight: 600; color: var(--ink-dim); margin-left: 5px; }
  .panel { background: var(--surface); border-radius: 13px; box-shadow: var(--shadow); padding: 4px 14px; }
  .bar { padding: 12px 0; }
  .bar + .bar { border-top: 1px solid #ECF1F7; }
  .bar .bt { display: flex; align-items: baseline; gap: 8px; margin-bottom: 7px; }
  .bar .bt .nm { flex: 1; min-width: 0; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 7px; }
  .bar .bt .nm i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .bar .bt .v { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar .bt .v small { color: var(--ink-dim); font-weight: 600; margin-left: 4px; font-size: 12.5px; }
  .track { height: 9px; border-radius: 5px; background: #EDF1F7; overflow: hidden; }
  .fill { height: 100%; border-radius: 5px; background: var(--blue); }
  .bf { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12.5px; color: var(--ink-mid); font-variant-numeric: tabular-nums; }
  .bf .done { color: var(--go); font-weight: 700; }
  .note { font-size: 12.5px; color: var(--ink-dim); margin: 9px 4px 0; line-height: 1.55; }

  /* ---------- 카드 목록 ---------- */
  .crec { background: var(--surface); border-radius: 13px; box-shadow: var(--shadow); padding: 12px 13px; margin-bottom: 8px; }
  .chead { display: flex; align-items: center; gap: 8px; }
  .chead h2 { flex: 1; min-width: 0; margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .edit {
    flex: 0 0 auto; min-height: 32px; padding: 0 14px; border-radius: 16px;
    background: transparent; box-shadow: inset 0 0 0 1px #D2DBE9; color: var(--ink-mid); font-size: 12.5px; font-weight: 600;
  }
  .ver {
    display: block; width: 100%; text-align: center; font-size: 12.5px; color: var(--ink-mid);
    padding: 14px 0 10px; background: var(--surface); border-radius: 12px; margin-top: 18px;
    box-shadow: inset 0 0 0 1px var(--rule); font-weight: 400;
  }
  .ver b { display: block; font-size: 14px; font-weight: 700; color: var(--blue-dk); }
  .ver .vsub { display: block; margin-top: 3px; font-size: 11px; color: var(--ink-dim); }

  /* ---------- 버튼 ---------- */
  button {
    font-family: inherit; font-size: 14px; font-weight: 600; border: none; border-radius: 11px;
    padding: 10px 16px; background: var(--blue); color: #fff; cursor: pointer;
  }
  button.ghost { background: #E9EFF7; color: var(--ink); }
  button:active { opacity: .68; }
  #fab {
    position: fixed; right: 18px; bottom: calc(var(--tabh) + 22px + env(safe-area-inset-bottom));
    width: 58px; height: 58px; border-radius: 29px; font-size: 30px; font-weight: 300; line-height: 1; padding: 0;
    background: var(--blue); box-shadow: 0 6px 18px rgba(45,91,215,.38); z-index: 41;
  }

  /* ---------- 시트 ---------- */
  .sheet {
    position: fixed; inset: 0; background: var(--surface); z-index: 50; overflow-y: auto; display: none;
    padding: calc(18px + env(safe-area-inset-top)) 16px 112px; animation: rise .16s ease-out;
  }
  .sheet.open { display: block; }
  @keyframes rise { from { transform: translateY(14px); opacity: .4; } }
  @media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
  .sheet h2 { margin: 2px 0 20px; font-size: 21px; font-weight: 700; letter-spacing: -.02em; }
  .sheet .lead { margin: -10px 0 20px; font-size: 13.5px; color: var(--ink-mid); line-height: 1.55; }
  label, .field { display: block; margin-bottom: 17px; }
  .lbl { display: block; font-size: 13px; font-weight: 600; color: var(--ink-mid); margin-bottom: 7px; }
  input[type=text], input[type=date], input[type=time] {
    width: 100%; padding: 12px 13px; font-size: 16px; border: 1.5px solid var(--rule); border-radius: 12px;
    font-family: inherit; background: var(--surface); color: var(--ink); -webkit-appearance: none; appearance: none;
  }
  input:focus { border-color: var(--blue); outline: none; }
  input[type=time], input[type=date] { font-variant-numeric: tabular-nums; min-height: 49px; }
  input.big { font-size: 26px; font-weight: 800; letter-spacing: -.02em; padding: 10px 13px; font-variant-numeric: tabular-nums; }
  .two { display: flex; gap: 8px; }
  .two > * { flex: 1; min-width: 0; }
  .seg { display: flex; gap: 7px; }
  .seg button {
    flex: 1; min-height: 48px; padding: 0 4px; border-radius: 12px;
    background: #EFF3F9; color: var(--ink-mid); font-size: 14px; font-weight: 500;
  }
  .seg button.sel { background: var(--blue); color: #fff; font-weight: 700; }
  .seg.many { flex-wrap: wrap; }
  .seg.many button { flex: 1 1 29%; min-width: 92px; }
  .seg.minus button.sel { background: var(--go); }
  .chkrow {
    display: flex; align-items: center; gap: 9px; min-height: 46px; padding: 0 13px; border-radius: 11px;
    background: #EFF3F9; cursor: pointer; -webkit-user-select: none; user-select: none;
  }
  .chkrow .box {
    flex: 0 0 auto; width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 6px;
    background: #fff; box-shadow: inset 0 0 0 1.5px #CCD6E6; color: transparent; font-size: 14px; font-weight: 700;
  }
  .chkrow .txt { font-size: 13.5px; color: var(--ink-mid); }
  .chkrow .txt small { display: block; font-size: 12px; color: var(--ink-dim); }
  .chkrow.on { background: var(--go-bg); }
  .chkrow.on .box { background: var(--go); box-shadow: none; color: #fff; }
  .chkrow.on .txt { color: var(--go); font-weight: 600; }
  .raw { padding: 9px 11px; background: var(--paper); border-radius: 10px; font-size: 12.5px; color: var(--ink-mid); word-break: break-all; line-height: 1.55; }
  .memo { padding: 8px 11px; background: var(--blue-tint); border-radius: 9px; font-size: 12.5px; color: #2C3E63; margin: -6px 0 17px; line-height: 1.5; }
  .actions {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--rule);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 9px; z-index: 60;
  }
  .actions button { flex: 1; min-height: 50px; font-size: 15px; font-weight: 700; border-radius: 13px; }
  .actions button.del { flex: 0 0 66px; background: var(--stop-bg); color: var(--stop); padding: 0; }
  .actions button.del.sure { flex: 0 0 96px; background: var(--stop); color: #fff; }
  .actions button:disabled { opacity: .5; }

  #toast {
    position: fixed; left: 50%; bottom: calc(var(--tabh) + 88px); transform: translateX(-50%);
    background: rgba(20,28,43,.94); color: #fff; padding: 11px 19px; border-radius: 22px;
    font-size: 13.5px; display: none; z-index: 100; max-width: 88vw; text-align: center; white-space: pre-line; line-height: 1.5;
  }
  #busy {
    position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 99;
    background: #fff; color: var(--head); border-radius: 14px; padding: 5px 12px; font-size: 12.5px; font-weight: 700;
    box-shadow: var(--shadow); display: none;
  }
  #busy.on { display: block; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="hrow">
    <button class="hbtn" id="prev" aria-label="이전 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 id="monthTitle" class="num">가계부</h1>
    <button class="hbtn" id="next" aria-label="다음 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="hsum"><div class="hl" id="heroLabel">&nbsp;</div><div class="ht num" id="heroTotal">&nbsp;</div></div>
  <div class="rbar" id="chips"></div>
</header>

<div class="wrap" id="view"><div class="empty">불러오는 중…</div></div>

<button id="fab" aria-label="추가">+</button>

<div id="tabs">
  <button id="tab_list" class="on" data-tab="list">내역<span id="uncCnt" class="tabcnt"></span></button>
  <button id="tab_stats" data-tab="stats">통계</button>
  <button id="tab_cards" data-tab="cards">카드</button>
</div>

<div id="sheet" class="sheet"></div>
<div id="toast"></div>
<div id="busy">저장 중…</div>

<script>
/* ============================================================
   가계부 — 화면 (깃허브 페이지)
   서버(Apps Script) 주소와 비밀키는 이 기기에만 저장합니다.
   ============================================================ */
var VERSION = 'v1';
var API = '', CODE = '';
try { API = localStorage.getItem('ldg_api') || ''; CODE = localStorage.getItem('ldg_code') || ''; } catch (e) {}

var COLORS = ['#E07A5F', '#C9A227', '#7A6FD0', '#3D8EB9', '#E3779B', '#3FA37A', '#8D8A82'];
var S = { data: null, month: '', tab: 'list', filter: 'all' };
var _seq = 0, BUSY = 0;

/* ---------- 서버 통신 (JSONP — 오늘병원과 같은 방식) ---------- */
function jsonp_(params, ok, fail) {
  var cb = '__cb' + (++_seq) + '_' + Date.now();
  var url = API + '?code=' + encodeURIComponent(CODE) + '&cb=' + cb;
  for (var k in params) url += '&' + k + '=' + encodeURIComponent(params[k]);
  var sc = document.createElement('script'), done = false;
  var timer = setTimeout(function () { finish(null, '서버 응답을 받지 못했습니다. (시간 초과)'); }, 25000);
  function finish(res, err) {
    if (done) return;
    done = true; clearTimeout(timer);
    try { delete window[cb]; } catch (e) { window[cb] = undefined; }
    if (sc.parentNode) sc.parentNode.removeChild(sc);
    if (err) return fail(err);
    if (res && res.ok) return ok(res);
    if (res && res.err === 'AUTH') return fail('AUTH');
    fail((res && res.err) || '알 수 없는 오류');
  }
  window[cb] = function (res) { finish(res, null); };
  sc.onerror = function () { finish(null, '서버에 닿지 못했습니다. 주소와 인터넷을 확인하세요.'); };
  sc.src = url;
  document.head.appendChild(sc);
}
var callServer = window.__mockServer || jsonp_;

function api(fn, params, opts) {
  opts = opts || {};
  params = params || {};
  params.fn = fn;
  return new Promise(function (resolve) {
    if (opts.busy) { BUSY++; $('busy').classList.add('on'); }
    callServer(params, function (res) {
      end(); setData(res); resolve(true);
    }, function (err) {
      end();
      if (err === 'AUTH') { toast('비밀키가 맞지 않습니다.', 3500); openSetup(); }
      else toast('실패: ' + err, 5000);
      resolve(false);
    });
    function end() { if (opts.busy && --BUSY <= 0) { BUSY = 0; $('busy').classList.remove('on'); } }
  });
}

/* ---------- 데이터 ---------- */
function setData(d) {
  S.data = d;
  var byId = {};
  d.txs.forEach(function (t) { byId[t.id] = t; });
  d.txs.forEach(function (t) {
    var o = t.link ? byId[t.link] : null;
    t.orig = o;
    t.eCat = (t.type === '취소' && (!t.category || t.category === '취소') && o) ? o.category : t.category;
    t.eCard = t.card || (t.type === '취소' && o ? o.card : '');
    t.sign = t.type === '취소' ? -1 : 1;
  });
  if (!S.month) S.month = d.now.slice(0, 7);
  render();
}
function monthTx() { return S.data.txs.filter(function (t) { return t.when.slice(0, 7) === S.month; }); }
function isUnc(t) { return t.type === '승인' && t.eCat === '미분류'; }
function sum(list) { return list.reduce(function (a, t) { return a + t.sign * t.amount; }, 0); }
function catColor(c) {
  var i = S.data.categories.indexOf(c);
  if (i >= 0) return COLORS[i % COLORS.length];
  return c === '취소' ? '#3FA37A' : '#C3CDDC';
}

/* ---------- 그리기 ---------- */
function render() {
  if (!S.data) return;
  var y = S.month.slice(0, 4), m = Number(S.month.slice(5));
  $('monthTitle').textContent = y + '년 ' + m + '월';
  var list = monthTx();
  $('heroLabel').textContent = m + '월 쓴 돈';
  $('heroTotal').innerHTML = won(sum(list), true);

  var unc = list.filter(isUnc).length;
  var noCard = list.filter(function (t) { return !t.eCard; }).length;
  var allUnc = S.data.txs.filter(isUnc).length;
  $('uncCnt').textContent = allUnc;
  $('uncCnt').classList.toggle('show', allUnc > 0);

  var chips = '';
  if (S.tab === 'list') {
    chips += chip('all', '전체', list.length);
    if (unc || S.filter === 'unc') chips += chip('unc', '미분류', unc, true);
    if (S.data.cards.length && (noCard || S.filter === 'nocard')) chips += chip('nocard', '카드 미지정', noCard, true);
  } else {
    chips = '<span>결제 ' + list.filter(function (t) { return t.type === '승인'; }).length + '건<span class="n">·</span> 취소 ' +
            list.filter(function (t) { return t.type === '취소'; }).length + '건</span>';
  }
  $('chips').innerHTML = chips;
  qa('#chips [data-f]').forEach(function (b) {
    b.onclick = function () { S.filter = (S.filter === b.dataset.f || b.dataset.f === 'all') ? 'all' : b.dataset.f; render(); };
  });

  qa('#tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === S.tab); });
  $('fab').hidden = S.tab === 'stats';
  if (S.tab === 'list') renderList(list);
  else if (S.tab === 'stats') renderStats(list);
  else renderCards();
}
function chip(key, label, n, warn) {
  return '<button class="' + (warn ? 'warn ' : '') + (S.filter === key ? 'on' : '') + '" data-f="' + key + '">' +
         label + '<span class="n">' + n + '</span></button>';
}

function renderList(list) {
  var rows = list.slice();
  if (S.filter === 'unc') rows = rows.filter(isUnc);
  if (S.filter === 'nocard') rows = rows.filter(function (t) { return !t.eCard; });
  rows.sort(function (a, b) { return a.when < b.when ? 1 : a.when > b.when ? -1 : 0; });
  if (!rows.length) {
    $('view').innerHTML = '<div class="empty">' + (S.filter === 'all' ? '이 달의 거래가 없습니다.<br>+ 를 눌러 직접 추가할 수 있어요.' : '해당하는 거래가 없습니다.') + '</div>';
    return;
  }
  var days = {}, order = [];
  rows.forEach(function (t) { var d = t.when.slice(0, 10); if (!days[d]) { days[d] = []; order.push(d); } days[d].push(t); });
  var today = S.data.now.slice(0, 10);
  var html = '';
  order.forEach(function (d) {
    html += '<div class="dayhead' + (d === today ? ' today' : '') + '">' + dayLabel(d) +
            '<span class="cnt">' + days[d].length + '건</span><span class="sum num">' + won(sum(days[d])) + '</span></div>';
    days[d].forEach(function (t) { html += recHtml(t); });
  });
  $('view').innerHTML = html;
  qa('#view .rec').forEach(function (b) { b.onclick = function () { openTx(b.dataset.id); }; });
}

function recHtml(t) {
  var cat = t.eCat, unc = isUnc(t);
  var title = t.memo || (unc ? '분류 전' : cat);
  var meta = [t.when.slice(11, 16)];
  if (t.memo && !unc) meta.push(esc(cat));
  if (t.eCard) meta.push(esc(t.eCard));
  else if (S.data.cards.length) meta.push('<b class="no">카드 미지정</b>');
  else meta.push(esc(t.app));
  if (t.excl) meta.push('실적 제외');
  var tag = '';
  if (unc) tag = '<span class="tag no">미분류</span>';
  if (t.type === '취소') tag = '<span class="tag yes">취소</span>';
  return '<button class="rec" data-id="' + t.id + '" style="border-left-color:' + (unc ? 'var(--stop)' : catColor(cat)) + '">' +
    '<div class="rtop"><h2>' + esc(title) + tag + '</h2><span class="amt' + (t.type === '취소' ? ' minus' : '') + '">' +
    (t.type === '취소' ? '−' : '') + won(t.amount) + '</span></div>' +
    '<div class="meta">' + meta.join('<span class="sep">|</span>') + '</div></button>';
}

function renderStats(list) {
  var html = '<div class="rhead">카드 실적<span class="cnt">' + Number(S.month.slice(5)) + '월 1일 ~ 말일</span></div><div class="panel">';
  if (!S.data.cards.length) {
    html += '<div class="empty" style="padding:22px 0">카드 탭에서 카드를 등록하면<br>카드별 실적이 보입니다.</div>';
  } else {
    S.data.cards.forEach(function (c) {
      var used = sum(list.filter(function (t) { return t.eCard === c.name && !t.excl; }));
      html += '<div class="bar"><div class="bt"><span class="nm">' + esc(c.name) + '</span><span class="v">' + won(used) +
              (c.target ? '<small>/ ' + won(c.target) + '</small>' : '') + '</span></div>';
      if (c.target) {
        var pct = Math.max(0, Math.min(100, used / c.target * 100));
        html += '<div class="track"><div class="fill" style="width:' + pct + '%;' + (used >= c.target ? 'background:var(--go)' : '') + '"></div></div>' +
                '<div class="bf"><span>' + Math.floor(used / c.target * 100) + '%</span>' +
                (used >= c.target ? '<span class="done">달성</span>' : '<span>' + won(c.target - used) + ' 남음</span>') + '</div>';
      }
      html += '</div>';
    });
    var nc = list.filter(function (t) { return !t.eCard; });
    if (nc.length) {
      html += '<div class="bar"><div class="bt"><span class="nm" style="color:var(--stop)">카드 미지정 ' + nc.length + '건</span>' +
              '<span class="v">' + won(sum(nc)) + '</span></div></div>';
    }
  }
  html += '</div><p class="note">결제 알림 시각으로 계산한 추정치입니다. 카드사 실적은 매입일과 실적 제외 가맹점(세금·상품권·관리비 등) 규정에 따라 다를 수 있어요. 빠지는 결제는 눌러서 ‘실적 제외’를 켜 주세요.</p>';

  var cats = {};
  list.forEach(function (t) { cats[t.eCat] = (cats[t.eCat] || 0) + t.sign * t.amount; });
  var keys = Object.keys(cats).filter(function (k) { return cats[k] !== 0; }).sort(function (a, b) { return cats[b] - cats[a]; });
  var max = Math.max.apply(null, keys.map(function (k) { return cats[k]; }).concat([1]));
  var total = sum(list) || 1;
  html += '<div class="rhead">분류별</div><div class="panel">';
  if (!keys.length) html += '<div class="empty" style="padding:22px 0">이 달의 거래가 없습니다.</div>';
  keys.forEach(function (k) {
    var v = cats[k];
    html += '<div class="bar"><div class="bt"><span class="nm"><i style="background:' + catColor(k) + '"></i>' + esc(k) + '</span>' +
            '<span class="v">' + won(v) + '<small>' + Math.round(v / total * 100) + '%</small></span></div>' +
            '<div class="track"><div class="fill" style="width:' + Math.max(0, v / max * 100) + '%;background:' + catColor(k) + '"></div></div></div>';
  });
  html += '</div>';
  $('view').innerHTML = html;
}

function renderCards() {
  var html = '<div class="rhead">내 카드<span class="cnt">' + S.data.cards.length + '장</span></div>';
  if (!S.data.cards.length) html += '<div class="empty" style="padding:26px 0">아래 + 로 카드를 추가하세요.</div>';
  S.data.cards.forEach(function (c) {
    var meta = [];
    meta.push(c.last4 ? '끝번호 <b>' + esc(c.last4) + '</b>' : '<b class="no">끝번호 없음</b>');
    meta.push(c.target ? '실적 ' + won(c.target) : '실적 목표 없음');
    html += '<div class="crec"><div class="chead"><h2>' + esc(c.name) + '</h2><button class="edit" data-id="' + c.id + '">수정</button></div>' +
            '<div class="meta">' + meta.join('<span class="sep">|</span>') + '</div>' +
            (c.keywords.length ? '<div class="meta">키워드 ' + esc(c.keywords.join(', ')) + '</div>' : '') + '</div>';
  });
  html += '<p class="note">결제 알림이 오면 <b>끝번호</b> → <b>키워드</b> 순서로 카드를 찾습니다. 같은 앱의 카드가 여러 장이면(우리카드 A·B) 끝번호를 꼭 넣어 주세요. 그래도 못 가리면 결제할 때 카드 고르는 창이 뜹니다.</p>' +
          '<button class="ver" id="setupBtn"><b>서버 연결 설정</b>주소·비밀키 바꾸기<span class="vsub">가계부 ' + VERSION + '</span></button>';
  $('view').innerHTML = html;
  qa('#view .edit').forEach(function (b) { b.onclick = function () { openCard(b.dataset.id); }; });
  $('setupBtn').onclick = openSetup;
}

/* ---------- 거래 추가·수정 ---------- */
function openTx(id) {
  var t = id ? S.data.txs.filter(function (x) { return x.id === id; })[0] : null;
  var now = S.data.now;
  var when = t ? t.when : (now.slice(0, 7) === S.month ? now : S.month + '-01 12:00:00');
  var st = {
    type: t ? t.type : '승인',
    cat: t ? (t.type === '취소' ? t.eCat : t.category) : '미분류',
    card: t ? (t.type === '취소' ? t.eCard : t.card) : '',
    excl: !!(t && t.excl)
  };
  var cats = S.data.categories.concat(['미분류']);
  var html = '<h2>' + (t ? '거래 수정' : '거래 추가') + '</h2>' +
    '<label><span class="lbl">금액</span><input type="text" class="big" id="fAmt" inputmode="numeric" placeholder="0" value="' + (t ? fmt(t.amount) : '') + '"></label>' +
    '<div class="field"><span class="lbl">구분</span><div class="seg" id="fType">' +
      '<button data-v="승인" class="' + (st.type === '승인' ? 'sel' : '') + '">결제</button>' +
      '<button data-v="취소" class="' + (st.type === '취소' ? 'sel' : '') + '">취소·환불</button></div></div>' +
    '<div class="field two"><label style="margin:0"><span class="lbl">날짜</span><input type="date" id="fDate" value="' + when.slice(0, 10) + '"></label>' +
      '<label style="margin:0"><span class="lbl">시간</span><input type="time" id="fTime" value="' + when.slice(11, 16) + '"></label></div>' +
    '<div class="field"><span class="lbl">분류</span><div class="seg many" id="fCat">' +
      cats.map(function (c) { return '<button data-v="' + esc(c) + '" class="' + (st.cat === c ? 'sel' : '') + '">' + esc(c) + '</button>'; }).join('') + '</div></div>';
  if (S.data.cards.length) {
    html += '<div class="field"><span class="lbl">카드</span><div class="seg many" id="fCard">' +
      [''].concat(S.data.cards.map(function (c) { return c.name; })).map(function (c) {
        return '<button data-v="' + esc(c) + '" class="' + (st.card === c ? 'sel' : '') + '">' + (c ? esc(c) : '미지정') + '</button>';
      }).join('') + '</div></div>';
  }
  html += '<label><span class="lbl">메모</span><input type="text" id="fMemo" placeholder="예: 쿠팡 기저귀" value="' + esc(t ? t.memo : '') + '"></label>' +
    '<div class="field"><div class="chkrow' + (st.excl ? ' on' : '') + '" id="fExcl"><span class="box">✓</span><span class="txt">실적 제외<small>카드 실적에 안 잡히는 결제 (세금, 상품권 등)</small></span></div></div>';
  if (t && t.type === '취소' && t.orig) html += '<div class="memo">' + esc(dayLabel(t.orig.when.slice(0, 10))) + ' ' + t.orig.when.slice(11, 16) + ' 결제(' + esc(t.orig.memo || t.orig.category) + ')의 취소로 연결됐습니다. 분류·카드를 바꾸지 않으면 원래 결제를 따라갑니다.</div>';
  if (t && t.raw) html += '<div class="field"><span class="lbl">알림 원문 · ' + esc(t.app) + '</span><div class="raw">' + esc(t.raw) + '</div></div>';
  html += '<div class="actions">' + (t ? '<button class="del" id="fDel">삭제</button>' : '') +
          '<button class="ghost" id="fClose">닫기</button><button id="fSave">저장</button></div>';
  openSheet(html);

  var amt = $('fAmt');
  amt.oninput = function () { var n = amt.value.replace(/\D/g, ''); amt.value = n ? fmt(Number(n)) : ''; };
  if (!t) setTimeout(function () { amt.focus(); }, 200);
  seg('fType', function (v) { st.type = v; $('fType').classList.toggle('minus', v === '취소'); });
  $('fType').classList.toggle('minus', st.type === '취소');
  seg('fCat', function (v) { st.cat = v; });
  if (S.data.cards.length) seg('fCard', function (v) { st.card = v; });
  $('fExcl').onclick = function () { st.excl = !st.excl; this.classList.toggle('on', st.excl); };
  $('fClose').onclick = closeSheet;
  $('fSave').onclick = function () {
    var amount = Number(amt.value.replace(/\D/g, ''));
    if (!amount) { toast('금액을 입력하세요'); return; }
    if (!$('fDate').value) { toast('날짜를 고르세요'); return; }
    var secs = (t && t.when.slice(11, 16) === $('fTime').value) ? t.when.slice(16, 19) : ':00';
    var cat = st.cat, card = st.card;
    if (t && t.type === '취소' && t.orig) {
      if (cat === t.orig.category && t.category === '취소') cat = '취소';
      if (card === t.orig.card && !t.card) card = '';
    }
    var data = { id: t ? t.id : '', amount: amount, type: st.type, when: $('fDate').value + ' ' + ($('fTime').value || '00:00') + secs,
                 category: cat, card: card, memo: $('fMemo').value, excl: st.excl };
    this.disabled = true;
    var btn = this;
    api('saveTx', { data: JSON.stringify(data) }, { busy: true }).then(function (ok) {
      btn.disabled = false;
      if (ok) { closeSheet(); toast(t ? '수정했습니다' : '추가했습니다'); }
    });
  };
  if (t) sureDel('fDel', function () {
    api('delTx', { id: t.id }, { busy: true }).then(function (ok) { if (ok) { closeSheet(); toast('삭제했습니다'); } });
  });
}

/* ---------- 카드 추가·수정 ---------- */
function openCard(id) {
  var c = id ? S.data.cards.filter(function (x) { return x.id === id; })[0] : null;
  var html = '<h2>' + (c ? '카드 수정' : '카드 추가') + '</h2>' +
    '<label><span class="lbl">카드 이름</span><input type="text" id="cName" placeholder="예: 우리 A (생활)" value="' + esc(c ? c.name : '') + '"></label>' +
    '<div class="field two"><label style="margin:0"><span class="lbl">끝번호 4자리</span><input type="text" id="cLast4" inputmode="numeric" maxlength="4" placeholder="7163" value="' + esc(c ? c.last4 : '') + '"></label>' +
      '<label style="margin:0"><span class="lbl">월 실적 목표 (원)</span><input type="text" id="cTarget" inputmode="numeric" placeholder="300,000" value="' + (c && c.target ? fmt(c.target) : '') + '"></label></div>' +
    '<label><span class="lbl">알림 키워드 (쉼표로 구분)</span><input type="text" id="cKw" placeholder="예: KBPay, KB국민" value="' + esc(c ? c.keywordText : '') + '"></label>' +
    '<p class="note" style="margin-top:-8px">알림을 보내는 앱 이름(KBPay, 우리카드 …)이나 알림 문구에 나오는 카드 이름을 적습니다. 실적 목표는 카드사 앱에서 그 카드의 <b>전월 실적 조건</b>을 확인해서 넣으세요.</p>' +
    '<div class="actions">' + (c ? '<button class="del" id="cDel">삭제</button>' : '') +
    '<button class="ghost" id="cClose">닫기</button><button id="cSave">저장</button></div>';
  openSheet(html);
  var tg = $('cTarget');
  tg.oninput = function () { var n = tg.value.replace(/\D/g, ''); tg.value = n ? fmt(Number(n)) : ''; };
  $('cClose').onclick = closeSheet;
  $('cSave').onclick = function () {
    var data = { id: c ? c.id : '', name: $('cName').value, last4: $('cLast4').value, target: tg.value.replace(/\D/g, ''), keywords: $('cKw').value };
    if (!data.name.trim()) { toast('카드 이름을 입력하세요'); return; }
    api('saveCard', { data: JSON.stringify(data) }, { busy: true }).then(function (ok) { if (ok) { closeSheet(); toast('저장했습니다'); } });
  };
  if (c) sureDel('cDel', function () {
    api('delCard', { id: c.id }, { busy: true }).then(function (ok) { if (ok) { closeSheet(); toast('삭제했습니다'); } });
  });
}

/* ---------- 서버 연결 설정 ---------- */
function openSetup() {
  var first = !API || !CODE;
  var html = '<h2>' + (first ? '가계부 시작하기' : '서버 연결 설정') + '</h2>' +
    '<p class="lead">Apps Script 웹앱 주소와 setup 실행 때 나온 비밀키를 넣어 주세요. 이 기기에만 저장됩니다.</p>' +
    '<label><span class="lbl">서버 주소</span><input type="text" id="sApi" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(API) + '" autocapitalize="off" autocorrect="off"></label>' +
    '<label><span class="lbl">비밀키</span><input type="text" id="sCode" placeholder="16자리" value="' + esc(CODE) + '" autocapitalize="off" autocorrect="off"></label>' +
    '<div class="actions">' + (first ? '' : '<button class="ghost" id="sClose">닫기</button>') + '<button id="sSave">연결</button></div>';
  openSheet(html);
  if (!first) $('sClose').onclick = closeSheet;
  $('sSave').onclick = function () {
    var u = $('sApi').value.trim(), k = $('sCode').value.trim();
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(u)) { toast('주소는 https://script.google.com/macros/s/…/exec 모양이어야 합니다.', 5000); return; }
    if (!k) { toast('비밀키를 입력하세요'); return; }
    API = u; CODE = k;
    try { localStorage.setItem('ldg_api', u); localStorage.setItem('ldg_code', k); } catch (e) {}
    api('all', {}, { busy: true }).then(function (ok) { if (ok) { closeSheet(); toast('연결했습니다'); } });
  };
}

/* ---------- 공통 ---------- */
function seg(id, onPick) {
  qa('#' + id + ' button').forEach(function (b) {
    b.onclick = function () {
      qa('#' + id + ' button').forEach(function (x) { x.classList.remove('sel'); });
      b.classList.add('sel'); onPick(b.dataset.v);
    };
  });
}
function sureDel(id, action) {
  var b = $(id), timer;
  b.onclick = function () {
    if (!b.classList.contains('sure')) {
      b.classList.add('sure'); b.textContent = '정말 삭제';
      timer = setTimeout(function () { b.classList.remove('sure'); b.textContent = '삭제'; }, 3000);
      return;
    }
    clearTimeout(timer); action();
  };
}
function openSheet(html) { var s = $('sheet'); s.innerHTML = html; s.scrollTop = 0; s.classList.add('open'); }
function closeSheet() { $('sheet').classList.remove('open'); }
function switchTab(tab) { S.tab = tab; S.filter = 'all'; render(); window.scrollTo(0, 0); }
function shiftMonth(d) {
  var y = Number(S.month.slice(0, 4)), m = Number(S.month.slice(5)) - 1 + d;
  var dt = new Date(y, m, 1);
  S.month = dt.getFullYear() + '-' + ('0' + (dt.getMonth() + 1)).slice(-2);
  S.filter = 'all'; render(); window.scrollTo(0, 0);
}
function dayLabel(ds) {
  var d = new Date(ds + 'T00:00:00');
  var w = ['일', '월', '화', '수', '목', '금', '토'][d.getDay()];
  var base = Number(ds.slice(5, 7)) + '.' + Number(ds.slice(8, 10)) + ' (' + w + ')';
  var t = S.data.now.slice(0, 10);
  if (ds === t) return base + ' 오늘';
  if ((new Date(t + 'T00:00:00') - d) === 86400000) return base + ' 어제';
  return base;
}
function fmt(n) { return Math.round(n).toLocaleString('ko-KR'); }
function won(n, big) { return fmt(n) + (big ? '<small>원</small>' : '원'); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
var toastTimer;
function toast(msg, ms) {
  var t = $('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.display = 'none'; }, ms || 2200);
}
function $(id) { return document.getElementById(id); }
function qa(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }

$('prev').onclick = function () { if (S.data) shiftMonth(-1); };
$('next').onclick = function () { if (S.data) shiftMonth(1); };
$('fab').onclick = function () { if (!S.data) return; if (S.tab === 'cards') openCard(''); else openTx(''); };
qa('#tabs button').forEach(function (b) { b.onclick = function () { if (S.data) switchTab(b.dataset.tab); }; });

/* 다른 앱에 다녀오면 새 결제가 들어와 있을 수 있으니 다시 불러온다 */
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && S.data && !$('sheet').classList.contains('open')) api('all');
});

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}

if (!API || !CODE) openSetup();
else api('all').then(function (ok) {
  if (ok || S.data) return;
  $('view').innerHTML = '<div class="empty">불러오지 못했습니다.<br><br><button class="ghost" id="retry">다시 불러오기</button> <button id="goSetup">연결 설정</button></div>';
  $('retry').onclick = function () { location.reload(); };
  $('goSetup').onclick = openSetup;
});
</script>
</body>
</html>
